<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="../assets/guarda.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Aldea Barefoot · Report de Performance · Molla</title>
<meta name="theme-color" content="#1A212B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400..900;125,700..900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E242C;--navy:#222A35;--navy-deep:#1A212B;--paper:#FFFFFF;--bg:#F5F5F2;
  --soft:#69717C;--soft-light:#9AA1AB;--line:#E5E3DC;
  --orange:#FF7A33;--orange-deep:#E05E14;--orange-chip:#FFF1E8;
  --green:#2E7D4F;--green-chip:#E4F2EA;--red:#C8402E;--red-chip:#FBEAE7;--amber:#A87512;--amber-chip:#FFF6E2;
  --blue:#3E6FB0;--blue-chip:#E8EFF8;--aldea:#0D3F3E;--aldea-chip:#E6EFEE;--gray-band:#EEF0F2;
  --meta:#E05E14;--google:#3E6FB0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 32px}
.disp{font-family:"Archivo",sans-serif;font-weight:850;letter-spacing:-.01em}

/* Topo (mesmo padrão da Central) */
.hero{position:relative;overflow:hidden;background:var(--navy-deep);color:#fff}
.hero::before{content:"";position:absolute;left:-240px;top:-280px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,51,.22) 0%,rgba(255,122,51,0) 62%);pointer-events:none}
.hero::after{content:"";position:absolute;right:-260px;bottom:-420px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(13,63,62,.6) 0%,rgba(13,63,62,0) 62%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.stripe{height:6px;background:linear-gradient(90deg,var(--orange),var(--orange-deep))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:20px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.08)}
.bar .molla{height:28px;width:auto;display:block}
#topbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pdf-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);font-family:"Archivo",sans-serif;font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border-radius:8px;cursor:pointer;transition:all .2s}
.pdf-btn svg{width:14px;height:14px}
.pdf-btn:hover{background:var(--orange);border-color:var(--orange);color:#fff}
.intro{display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:end;padding-top:44px;padding-bottom:44px}
.chip{display:inline-block;background:rgba(255,122,51,.14);color:var(--orange);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;padding:7px 16px;border-radius:999px}
h1{margin-top:16px;font-family:"Archivo",sans-serif;font-weight:850;font-size:clamp(34px,4.6vw,54px);line-height:1.02;letter-spacing:-.015em}
h1 em{font-style:normal;color:var(--orange)}
.lead{margin-top:14px;max-width:620px;font-size:15.5px;line-height:1.55;color:rgba(255,255,255,.72)}
.edbox{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:18px}
.edbox label{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:rgba(255,255,255,.5);margin-bottom:8px}
.edbox select{width:100%;background:var(--navy-deep);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}
.edmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.edmeta span{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.78);background:rgba(255,255,255,.08);padding:4px 10px;border-radius:999px}
.edmeta span.t{background:var(--orange);color:#fff}
.edtitle{margin-top:10px;font-size:13.5px;color:rgba(255,255,255,.75);line-height:1.45}

/* Barra de filtros + capítulos */
.sticky{position:sticky;top:0;z-index:20;background:rgba(245,245,242,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;padding-top:14px;padding-bottom:10px}
.fgroup{display:flex;flex-direction:column;gap:5px}
.fgroup>span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--soft)}
.seg{display:inline-flex;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:none;background:none;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:700;color:var(--soft);cursor:pointer}
.seg button.on{background:var(--navy-deep);color:#fff}
.sel{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;min-width:0;max-width:100%}
.dates{display:flex;gap:6px;align-items:center}
.dates input{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px}
.dates[hidden]{display:none}
.fnote{flex-basis:100%;font-size:12.5px;color:var(--soft);display:flex;gap:8px;align-items:flex-start}
.fnote b{color:var(--ink)}
.chapnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.chapnav::-webkit-scrollbar{display:none}
.chapnav a{flex-shrink:0;text-decoration:none;font-size:13px;font-weight:700;color:var(--soft);padding:10px 12px 12px;border-bottom:3px solid transparent;white-space:nowrap}
.chapnav a b{font-family:"Archivo",sans-serif;font-weight:850;color:var(--soft-light);margin-right:6px}
.chapnav a:hover{color:var(--ink)}
.chapnav a.on{color:var(--ink);border-color:var(--orange)}
.chapnav a.on b{color:var(--orange-deep)}

/* Report executivo: antes x agora, jornada, plano */
.ad{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px 20px}
.ad.plano{border:0;padding:0;background:none}
.ad-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--soft);margin-bottom:6px}
.ad-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ad-leg .r i,.adb .r i{background:#C7CCD3}.ad-leg .a i,.adb .a i{background:var(--meta)}
.adr{display:grid;grid-template-columns:180px minmax(0,1fr) 96px;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ad-leg+.adr{border-top:0}
.adl b{display:block;font-size:14px;font-weight:800}.adl small{display:block;color:var(--soft);font-size:11.5px}
.adb{display:flex;flex-direction:column;gap:5px}
.adb div{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.adb .r span{color:var(--soft)}
.adb span{white-space:nowrap}.adb i{max-width:calc(100% - 74px)}
.adb i{display:block;height:15px;border-radius:0 5px 5px 0}
.adt{font-size:13px;color:var(--soft)}.adt b{color:var(--ink)}
.adc{font-family:"Archivo",sans-serif;font-weight:850;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.adc small{display:block;font-family:"Inter",sans-serif;font-weight:600;font-size:10.5px;color:var(--soft);line-height:1.3}
.adc.up-good{color:var(--green)}.adc.up-bad{color:var(--red)}.adc.neutral{color:var(--soft)}
.adc.neutral:not(:empty){font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.stat span{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.stat b{display:block;font-family:"Archivo",sans-serif;font-weight:850;font-size:24px;line-height:1.2;margin-top:2px}
.stat small{display:block;font-size:11.5px;color:var(--soft)}
.fonte{font-size:11px;font-weight:700;color:var(--soft-light);text-transform:uppercase;letter-spacing:.08em}
.chart-head .fonte{margin-left:auto}
.jornada{display:flex;gap:0;margin:4px 0 8px;overflow-x:auto;padding-bottom:4px}
.jornada .j{flex:1;min-width:130px;position:relative;padding:22px 12px 0 0}
.jornada .j::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line)}
.jornada .j i{position:absolute;left:0;top:1px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--soft-light)}
.jornada .j.preparacao i{border-color:#C9B48A}.jornada .j.campanha i{border-color:var(--orange-deep);background:var(--orange-deep)}
.jornada .j span{display:block;font-size:11.5px;font-weight:700;color:var(--soft)}
.jornada .j b{display:block;font-size:13.5px;line-height:1.3}
details.exp{margin:10px 0 0}
details.exp summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--soft)}
details.exp[open] summary{margin-bottom:10px}
.vermais{font-weight:800;font-size:13.5px;color:var(--orange-deep);text-decoration:none}
.vermais:hover{text-decoration:underline}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kcol{background:var(--gray-band);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.kh{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:2px 2px 4px}
.kc{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;font-weight:600;line-height:1.4}
.kc .id{font-size:10.5px;font-weight:800;color:var(--soft-light);margin-right:6px}
.kc small{display:block;font-weight:600;font-size:11.5px;color:var(--amber);margin-top:3px}
.negbox{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.det>.sec:first-child{margin-top:18px}
/* Capítulos */
main{flex:1;padding:28px 0 64px}
.chapter{display:none}
.chapter.on{display:block}
.ch-head{scroll-margin-top:calc(var(--stick-h,150px) + 12px)}
.ch-head{margin-bottom:22px}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--orange-deep);font-weight:800;margin-bottom:10px}
.eyebrow::before{content:"";width:36px;height:3px;background:var(--orange)}
h2{font-family:"Archivo",sans-serif;font-weight:850;font-size:clamp(26px,3vw,36px);line-height:1.08;letter-spacing:-.01em}
.ch-lead{margin-top:10px;font-size:15px;color:var(--soft);max-width:860px}
h3.sec{font-family:"Archivo",sans-serif;font-weight:800;font-size:19px;margin:34px 0 4px;display:flex;align-items:center;gap:10px}
.sec-sub{font-size:13.5px;color:var(--soft);margin-bottom:14px;max-width:860px}
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.kpis.k5{grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
.kpi{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px 13px;position:relative;min-width:0}
.kpi .l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:800;display:flex;align-items:center;gap:6px;justify-content:space-between}
.kpi .v{font-family:"Archivo",sans-serif;font-weight:850;font-size:26px;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v.na{color:var(--soft-light);font-size:18px}
.kpi .d{margin-top:6px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.kpi .d small{font-weight:600;color:var(--soft)}
.kpi .n{font-size:11.5px;color:var(--soft);margin-top:4px;line-height:1.35}
.kpi.meta{border-top:4px solid var(--meta)}.kpi.google{border-top:4px solid var(--google)}
.up-good{color:var(--green)}.up-bad{color:var(--red)}.neutral{color:var(--soft)}
.o{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.04em;border:1px solid var(--line);color:var(--soft);background:var(--bg);cursor:help;flex-shrink:0}
.o.A{background:var(--orange-chip);border-color:#FFD9C2;color:var(--orange-deep)}
.o.C{background:var(--blue-chip);border-color:#CFDDF0;color:var(--blue)}
.o.R{background:var(--aldea-chip);border-color:#C9DCDA;color:var(--aldea)}
.plat{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.plat i{width:9px;height:9px;border-radius:3px;display:inline-block}
.plat.meta i{background:var(--meta)}.plat.google i{background:var(--google)}.plat.ambas i{background:linear-gradient(90deg,var(--meta) 50%,var(--google) 50%)}

/* Cartões de leitura */
.ins{background:var(--paper);border:1.5px solid var(--line);border-left:5px solid var(--soft-light);border-radius:14px;padding:15px 16px}
.ins .h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ins .tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--soft);display:flex;align-items:center;gap:6px}
.ins .tag svg{width:14px;height:14px}
.ins h4{font-size:15px;font-weight:800;line-height:1.3;margin:6px 0 4px}
.ins p{font-size:13.5px;color:var(--soft);line-height:1.5}
.ins.bom{border-left-color:var(--green)}.ins.bom .tag{color:var(--green)}
.ins.atencao{border-left-color:var(--red)}.ins.atencao .tag{color:var(--red)}
.ins.oportunidade{border-left-color:var(--orange)}.ins.oportunidade .tag{color:var(--orange-deep)}
.qa{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.qa .q{display:flex;gap:10px;align-items:baseline;font-family:"Archivo",sans-serif;font-weight:800;font-size:15.5px;line-height:1.3}
.qa .q b{color:var(--orange-deep);font-size:13px;min-width:20px}
.qa p{margin-top:6px;font-size:13.5px;color:var(--soft);line-height:1.55;padding-left:30px}
.read{background:var(--orange-chip);border-left:5px solid var(--orange);border-radius:0 12px 12px 0;padding:14px 18px;font-size:14px;line-height:1.55}
.read b.k{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange-deep);font-weight:800;margin-bottom:4px}
.empty{background:var(--paper);border:1.5px dashed #D6D3C9;border-radius:14px;padding:22px;text-align:center;color:var(--soft);font-size:13.5px}
.empty b{display:block;font-family:"Archivo",sans-serif;font-size:16px;color:var(--ink);margin-bottom:4px}
ol.prio{list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:8px}
ol.prio li{counter-increment:p;display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600}
ol.prio li::before{content:counter(p);font-family:"Archivo",sans-serif;font-weight:850;color:#fff;background:var(--orange-deep);min-width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px}
ul.chk{list-style:none;display:flex;flex-direction:column;gap:8px}
ul.chk li{display:flex;gap:10px;font-size:13.5px;line-height:1.45}
ul.chk li::before{content:"";width:16px;height:16px;min-width:16px;margin-top:2px;border:2px solid var(--soft-light);border-radius:5px}

/* Tabelas */
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px;background:var(--paper)}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.t th{position:sticky;top:0;background:var(--navy);color:#fff;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;text-align:right;padding:10px 12px;white-space:nowrap;cursor:pointer;user-select:none}
.t th:first-child,.t td:first-child{text-align:left}
.t th.l,.t td.l{text-align:left}
.t th[data-s]::after{content:" ↕";opacity:.4}
.t th.asc::after{content:" ↑";opacity:1}.t th.desc::after{content:" ↓";opacity:1}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;white-space:nowrap}
.t td.wrap{white-space:normal;min-width:220px}
.t tr:last-child td{border-bottom:none}
.t tr.tot td{background:var(--bg);font-weight:800}
.t .nm{font-weight:700;white-space:normal;min-width:200px;max-width:340px}
.t .nm small{display:block;font-weight:500;color:var(--soft-light);font-size:11px;word-break:break-all}
.t td.dim{color:var(--soft-light)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
.badge.g{background:var(--green-chip);color:var(--green)}.badge.r{background:var(--red-chip);color:var(--red)}
.badge.a{background:var(--amber-chip);color:var(--amber)}.badge.o{background:var(--orange-chip);color:var(--orange-deep)}
.badge.n{background:var(--bg);color:var(--soft);border:1px solid var(--line)}.badge.b{background:var(--blue-chip);color:var(--blue)}
.badge.ok{background:var(--green);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--soft);cursor:pointer}
.tabs button.on{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff}
.tabs button span{opacity:.6;margin-left:4px}

/* Gráficos */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:#E9E7E1;stroke-width:1}
.chart text{font-family:"Inter",sans-serif;font-size:11px;fill:var(--soft)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hover-line{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--navy-deep);color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45;white-space:nowrap;box-shadow:0 8px 24px rgba(26,33,43,.25);transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;z-index:5}
.tip b{font-weight:800}
.tip.on{opacity:1}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.chart-head h4{font-size:14.5px;font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--soft);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.mini{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.mini h5{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--soft);margin-bottom:6px}
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center;font-size:13px}
.frow .bar{height:22px;border-radius:0 6px 6px 0;background:var(--meta);min-width:2px;padding:0}
.frow .bar.c{background:#C7CCD3}
.frow .lab{font-weight:700}
.frow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.frow .val small{display:block;font-weight:500;color:var(--soft);font-size:11px}

/* Linha do tempo */
.tl{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:12px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}

<script>
(function(){

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

var MES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function oTag(o){ return o ? '<span class="o '+o+'" title="'+esc(ORIG[o]||'')+'">'+o+'</span>' : ''; }

var IC = {bom:'M20 6L9 17l-5-5', atencao:'M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z', oportunidade:'M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8', neutro:'M12 8h.01M11 12h1v4h1M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z', copy:'M9 9h11v11H9zM5 15H4V4h11v1', info:'M12 8h.01M11 12h1v4h1M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z'};
var KNOME = {bom:'Resultado positivo', atencao:'Ponto de atenção', oportunidade:'Oportunidade', neutro:'Leitura'};
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.classList.add('on'); setTimeout(function(){ e.classList.remove('on'); },2200); }

/* ====================================================================== Taxonomia Meta */
function estrutura(c){ return /^META_ADS_/.test(c) ? 'Nova' : 'Anterior'; }
function objetivo(c){
  if (/_ENG_/.test(c)) return 'Engajamento';

var SOMA = ['g','im','ck','cp','rv','atc','ic','msg','v25','v50','v75','v95','v100','eng'];

function der(o){
  o.ctr = o.im ? o.ck/o.im*100 : null; o.cpc = o.ck ? o.g/o.ck : null; o.cpm = o.im ? o.g/o.im*1000 : null;

function delta(k, a, b, nA, nB){
  var def=KDEF[k]; if (!b) return '';

  if (va==null || vb==null) return '<div class="d neutral"><small>sem base de comparação</small></div>';
  var norm = def.vol && nA!==nB;
  if (norm){ va=va/nA; vb=vb/nB; }
  if (vb===0) return va===0 ? '<div class="d neutral">= <small>igual</small></div>' : '<div class="d neutral"><small>antes: zero</small></div>';
  var p=(va-vb)/Math.abs(vb)*100, up=p>0;
  var curto = def.venda && nA<14;

  var arrow = Math.abs(p)<0.5 ? '=' : (up ? '▲' : '▼');
  return '<div class="d '+cls+'">'+arrow+' '+pct(Math.abs(p),1)+' <small>'+(norm?'por dia · ':'')+'vs '+(norm&&def.f===int?dec:def.f)(norm?b[k]/nB:b[k])+(norm?'/dia':'')+(curto?' · período curto para leitura de vendas':'')+'</small></div>';

function marcar(gr){

  gr.forEach(function(g){

    if (g===best) f.push('<span class="badge g">Destaque · ROAS</span>');

    if (g.g>=50 && g.cp===0 && g.diasAtivos>=14 && (g.obj==='Vendas'||g.obj==='Tráfego')) f.push('<span class="badge a">Atenção · sem venda</span>');

  h+=tabela('fontes',[{t:'Plataforma',l:1,f:function(r){return '<span class="plat '+r.plataforma+'"><i></i>'+(r.plataforma==='meta'?'Meta':'Google')+'</span>';}},{t:'Arquivo',l:1,cls:'wrap',f:function(r){return esc(r.arquivo)+(r.observacao?'<br><small class="dim">'+esc(r.observacao)+'</small>':'');}},
    {t:'Período',l:1,f:function(r){return per(r.ini,r.fim);}},{t:'Recebido',l:1,f:function(r){return fd(r.recebido);}},{t:'Nível',l:1,f:function(r){return esc(r.nivel);}},{t:'Linhas',f:function(r){return int(r.linhas);}},
    {t:'Investimento',f:function(r){return brl(r.gastoSoma);}},{t:'Conferência',l:1,f:function(r){ return r.conferencia?'<span class="badge n">'+esc(r.conferencia)+'</span>':r.plataforma==='meta'?(r.confere?'<span class="badge g">Total confere</span>':'<span class="badge r">Diverge</span>'):(r.gastoArquivo==null?'<span class="badge n">Sem linha de total</span>':''); }}],fontes,{});
  // verificações automáticas
  var chaves={}, dup=0; ROWS.forEach(function(r){ var k=[r.d,r.c,r.s,r.a,r.p].join('|'); if (chaves[k]) dup++; chaves[k]=1; });
  var lacunas=[], d=D0, ativo={}; ROWS.forEach(function(r){ if (r.g>0) ativo[r.d]=1; });
  var ini=null; while (d<=D1){ if (!ativo[d]){ if (!ini) ini=d; } else if (ini){ lacunas.push([ini,addD(d,-1)]); ini=null; } d=addD(d,1); }
  var atr={}; ROWS.forEach(function(r){ atr[r.at]=(atr[r.at]||0)+1; });
  var gf=(GOOG.fontes||[]);
  var checks=[
    {ok:dup===0, t:'Duplicidade no Meta', x:dup===0?'Nenhuma linha repetida (dia, campanha, conjunto, anúncio e posicionamento).':dup+' linhas repetidas encontradas.'},
    {ok:lacunas.every(function(l){ return ctxLacuna(l); }), t:'Períodos sem anúncios no Meta', x:lacunas.length?lacunas.map(function(l){ var c=ctxLacuna(l); return per(l[0],l[1])+' ('+nDias(l[0],l[1])+' dias)'+(c?': '+c.titulo.toLowerCase()+' (registrado)':': contexto a registrar'); }).join(' · '):'Anúncios no ar em todos os dias do intervalo.'},
    {ok:Object.keys(atr).length<2, t:'Critérios de atribuição', x:'As campanhas usam critérios diferentes para atribuir uma venda a um anúncio. Detalhe técnico: '+Object.keys(atr).map(function(k){ return k+' ('+atr[k]+' linhas)'; }).join(' · ')+'. 7C = clique em até 7 dias · 1V = visualização em até 1 dia · 1VE = visualização com engajamento em até 1 dia · 1C = clique em até 1 dia.'},
    {ok:false, t:'Alcance', x:'Alcance não se soma entre dias e anúncios (a mesma pessoa aparece em vários). O report usa apenas o alcance único informado no total do arquivo: '+int((META.fontes[0]||{}).alcanceUnicoArquivo)+' pessoas no período do arquivo.'},
    {ok:gf.every(function(f){ return f.temDia; }), t:'Google por dia', x:gf.every(function(f){ return f.temDia; })?'Exportação diária disponível.':'Exportação só consolidada: sem evolução diária e sem separação antes e depois da régua nova.'},
    {ok:gf.some(function(f){ return f.temValorConversao; }), t:'Valor de conversão do Google', x:gf.some(function(f){ return f.temValorConversao; })?'Disponível.':'Ausente: ROAS e receita do Google não podem ser calculados.'}
  ];
  h+=sec('Verificações automáticas','Rodam toda vez que a página abre, sobre os dados atuais.');
  h+='<div class="grid g2">'+checks.map(function(c){ return '<div class="ins '+(c.ok?'bom':'neutro')+'"><div class="h"><span class="tag">'+ico(c.ok?IC.bom:IC.info)+(c.ok?'Ok':'Observação')+'</span>'+oTag('C')+'</div><h4>'+c.t+'</h4><p>'+esc(c.x)+'</p></div>'; }).join('')+'</div>';
  // fotografia
  var fA=e.fotografia&&e.fotografia.meta, now=agg(filtra(e.periodo.ini,e.periodo.fim));
  if (fA){
    var dif=Math.abs(now.g-fA.gasto)>0.05||now.cp!==fA.compras;
    h+=sec('Fotografia da edição','Números do período da edição no dia da publicação, guardados para auditoria.');
    h+=(dif?warn('Os dados deste período mudaram depois da publicação (reexportação com conversões atrasadas). Publicação: '+brl(fA.gasto)+' e '+fA.compras+' compras. Hoje: '+brl(now.g)+' e '+now.cp+' compras.'):'<div class="ins bom"><div class="h"><span class="tag">'+ico(IC.bom)+'Base intacta</span></div><p>Meta no período da edição: '+brl(now.g)+', '+int(now.ck)+' cliques, '+now.cp+' compras e '+brl(now.rv)+' de receita, iguais à publicação.</p></div>');
  }
  h+=sec('Regras de comparação');
  h+='<div class="panel"><ul class="chk">'+[
    'Períodos com durações diferentes são comparados pela média diária nos volumes (investimento, cliques, compras). Taxas (taxa de clique, custos médios e retorno) são comparadas diretamente.',
    'O padrão é comparar com o período anterior de mesma duração. Em edições mensais, também com o mesmo período do mês anterior.',
    'Se a comparação não teve entrega, o report diz isso em vez de mostrar variação.',
    'Períodos que se sobrepõem são sinalizados no topo da página.',
    'Conversões do Google não se comparam entre réguas diferentes (ver Mensuração Google, no Detalhamento). Cliques, impressões, CTR e CPC, sim.',
    'Campanhas com objetivos diferentes (vendas, tráfego, engajamento, leads) não são comparadas pelo custo do clique.',
    'Cada reexportação substitui apenas os dias que ela cobre: não existe soma em dobro.'
  ].map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ul></div>';
  h+=sec('Modalidades de acompanhamento','Mesma estrutura visual; muda a profundidade.');
  h+=tabela('mod',[{t:'Modalidade',l:1,f:function(r){return '<b>'+r.m+'</b>';}},{t:'Comparação padrão',l:1,cls:'wrap',f:function(r){return r.c;}},{t:'Foco',l:1,cls:'wrap',f:function(r){return r.f;}},{t:'Capítulos com análise completa',l:1,cls:'wrap',f:function(r){return r.cap;}}],[
    {m:'Semanal',c:'7 dias anteriores',f:'Evolução operacional, resultados recentes, otimizações feitas e pendências.',cap:'Resumo, Meta, Google, Termos (revisão semanal) e Plano'},
    {m:'Quinzenal',c:'14 dias anteriores',f:'Tendências, aprendizados e ajustes de estratégia.',cap:'Todos, com leitura de públicos e criativos'},
    {m:'Mensal',c:'Mês anterior e mesmo período do mês anterior',f:'Análise executiva, comparativos e planejamento do mês seguinte.',cap:'Todos, com redistribuição de verba e revisão do plano'}],{});
  h+=sec('Definições');
  h+=tabela('def',[{t:'Indicador',l:1,f:function(r){return '<b>'+r[0]+'</b>';}},{t:'Como é calculado',l:1,cls:'wrap',f:function(r){return r[1];}}],[
    ['Taxa de clique (CTR)','Cliques no link ÷ impressões'],['Custo por clique (CPC)','Investimento ÷ cliques no link'],['Custo por mil impressões (CPM)','Investimento ÷ impressões × 1.000'],['Custo por seguidor','Investimento da campanha de seguidores ÷ seguidores no Instagram que ela trouxe'],
    ['Custo por venda (CPA)','Investimento ÷ vendas atribuídas'],['Retorno (ROAS)','Receita atribuída ÷ investimento. 2,0 = cada R$ 1 investido trouxe R$ 2 em vendas atribuídas'],['Venda por clique','Vendas ÷ cliques no link'],
    ['Chegam a 25%','Reproduções de 25% do vídeo ÷ impressões'],['Vão até o fim','Reproduções de 100% ÷ reproduções de 25%'],
    ['Conversões registradas (Google)','Coluna Conversões do Google Ads. Até a régua nova, pode incluir carrinho e checkout.']],{});
  h+=sec('Como uma nova edição entra','Fluxo de atualização a cada reunião.');
  h+='<div class="steps">'+[['Exportar','Meta: relatório por dia, nível anúncio, com posicionamento. Google: campanhas por dia com valor de conversão, conversões por ação e termos de pesquisa.'],['Converter','A Molla roda o conversor, que acrescenta os dias novos e substitui só os dias reexportados.'],['Registrar','Acontecimentos, mudanças de mensuração e decisões da reunião entram no registro, com data.'],['Analisar','Nova edição com período, comparação, textos e fotografia. As anteriores não são tocadas.'],['Publicar','Os arquivos sobem para a Central. O report abre na edição mais recente.']].map(function(s){ return '<div><b>'+s[0]+'</b>'+s[1]+'</div>'; }).join('')+'</div>';
  return h;
}

/* ====================================================================== Eventos de interface */
function ligar(){
  root.querySelectorAll('[data-tab]').forEach(function(box){
    box.addEventListener('click',function(ev){ var b=ev.target.closest('button'); if (!b) return; S.tab[box.getAttribute('data-tab')]=b.getAttribute('data-v'); var y=window.scrollY; render(); window.scrollTo(0,y); });
  });
  root.querySelectorAll('table.t').forEach(function(tb){
    tb.querySelectorAll('th[data-s]').forEach(function(th){ th.addEventListener('click',function(){
      var id=tb.getAttribute('data-tbl'), k=th.getAttribute('data-s'), st=TBL[id]||{};
      TBL[id]={k:k, dir:st.k===k?-st.dir:-1}; var y=window.scrollY; render(); window.scrollTo(0,y);
    }); });
  });
  ligarPauta();
  var cp=document.getElementById('copiarNeg');
  if (cp) cp.onclick=function(){
    var pend=REG.negativacao.filter(function(n){ return n.status==='Pendente'; });
    var txt='Oi, pessoal! Seguem as negativações do Google Ads que precisam da validação de vocês antes de entrar na conta:\n\n'+
      pend.map(function(n){ return n.id+' · '+n.familia+': '+n.termos.join(', '); }).join('\n')+
      '\n\nDá para responder com o código e "aprovo" ou "não aprovo" (ex.: N03 não aprovo). Os detalhes e a justificativa de cada uma estão no Report de Performance, na Central.';
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){ toast('Texto copiado'); },function(){ window.prompt('Copie o texto:',txt); });
  };
}
document.getElementById('plat').addEventListener('click',function(ev){
  var b=ev.target.closest('button'); if (!b) return; S.plat=b.getAttribute('data-p');
  [].forEach.call(this.children,function(x){ x.classList.toggle('on',x===b); }); render();
});
function preencherSelects(){
  var p=document.getElementById('periodo'), c=document.getElementById('comp');
  p.innerHTML=opcoesPeriodo().map(function(o){ return '<option value="'+o[0]+'">'+esc(o[1])+'</option>'; }).join('');
  c.innerHTML=opcoesComp().map(function(o){ return '<option value="'+o[0]+'">'+esc(o[1])+'</option>'; }).join('');
  p.value=S.pSel; c.value=S.cSel;
}
document.getElementById('periodo').onchange=function(){
  S.pSel=this.value; var cu=this.value==='custom'; document.getElementById('pCustom').hidden=!cu;
  if (cu){ document.getElementById('pIni').value=S.ini; document.getElementById('pFim').value=S.fim; }
  var c=document.getElementById('comp'); if (S.pSel!=='padrao' && S.cSel==='padrao'){ S.cSel='anterior'; c.value='anterior'; }
  render();
};
document.getElementById('comp').onchange=function(){
  S.cSel=this.value; var cu=this.value==='custom'; document.getElementById('cCustom').hidden=!cu;
  if (cu){ document.getElementById('cIni').value=S.cIni||addD(S.ini,-7); document.getElementById('cFim').value=S.cFim||addD(S.ini,-1); }
  render();
};
['pIni','pFim','cIni','cFim'].forEach(function(id){ var el=document.getElementById(id); el.min=D0; el.max=D1; el.onchange=render; });
document.getElementById('edicao').onchange=function(){ location.hash=this.value+'/'+S.cap; };
document.getElementById('ftoggle').onclick=function(){ var st=document.getElementById('sticky'), on=!st.classList.contains('open'); st.classList.toggle('open',on); this.setAttribute('aria-expanded',on); alturaSticky(); };
document.addEventListener('click',function(ev){
  var a=ev.target.closest('a[href^="#"]'); if (!a) return;
  var alvo=a.getAttribute('href');
  if (a.getAttribute('data-det')) S.tab.det=a.getAttribute('data-det');
  S.rolar=true;
  if (alvo===location.hash){ ev.preventDefault(); irCapitulo(); S.rolar=false; }
  var st=document.getElementById('sticky'); if (window.innerWidth<=680 && st.classList.contains('open')){ st.classList.remove('open'); document.getElementById('ftoggle').setAttribute('aria-expanded','false'); }
});
document.getElementById('imprimir').onclick=function(){
  var cap=S.cap, html='';
  CH=[]; resolvePeriodo();
  var nA=nDias(S.ini,S.fim), nB=S.cIni?nDias(S.cIni,S.cFim):0, e=ed();
  var fn={estavamos:capEstavamos, agora:capAgora, aprendizados:capAprendizados, proximos:capProximos, detalhes:capDetalhes, historico:capHistorico, dados:capDados};
  CHAPS.forEach(function(c){ if (c.id!=='detalhes') html+='<section class="chapter on">'+fn[c.id](e,nA,nB)+'</section>'; });
  root.innerHTML=html; desenhar();
  setTimeout(function(){ window.print(); S.cap=cap; render(); },400);
};
var rz; window.addEventListener('resize',function(){ clearTimeout(rz); rz=setTimeout(desenhar,150); });

function rota(){
  var h=location.hash.replace('#','').split('/'), id=h[0], cap=h[1];
  var e=EDS.filter(function(x){ return x.id===id; })[0]||EDS[0];
  var mudou=!S.ed||S.ed.id!==e.id;
  if (ALIAS[cap]){ if (ALIAS[cap][1]) S.tab.det=ALIAS[cap][1]; cap=ALIAS[cap][0]; }
  S.ed=e; S.cap=CHAPS.some(function(c){ return c.id===cap; })?cap:(mudou?'estavamos':S.cap);
  if (mudou){ S.pSel=e.padrao?'padrao':'edicao'; S.cSel=e.padrao&&e.padrao.comp?'padrao':'anterior'; document.getElementById('edicao').value=e.id; preencherSelects(); document.getElementById('pCustom').hidden=true; document.getElementById('cCustom').hidden=true; }
  render();
  if (S.rolar || (S.primeira && cap)) irCapitulo();
  S.rolar=false; S.primeira=false;
}
if (!EDS.length){ root.innerHTML='<div class="empty"><b>Nenhuma edição publicada</b>Os reports aparecem aqui assim que a primeira edição for cadastrada.</div>'; return; }
document.getElementById('edicao').innerHTML=EDS.map(function(x){ return '<option value="'+x.id+'">Report '+String(x.numero).padStart(2,'0')+' · '+({semanal:'Semanal',quinzenal:'Quinzenal',mensal:'Mensal'}[x.tipo]||x.tipo)+' · '+per(x.periodo.ini,x.periodo.fim)+'</option>'; }).join('');
window.addEventListener('hashchange',rota);
S.primeira=true;
if ('scrollRestoration' in history) history.scrollRestoration='manual';
rota();
})();
</script>
