<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="../assets/guarda.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Aldea Barefoot · Report de Performance · Molla</title>
<meta name="theme-color" content="#1A212B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400..900;125,700..900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E242C;--navy:#222A35;--navy-deep:#1A212B;--paper:#FFFFFF;--bg:#F5F5F2;
  --soft:#69717C;--soft-light:#9AA1AB;--line:#E5E3DC;
  --orange:#FF7A33;--orange-deep:#E05E14;--orange-chip:#FFF1E8;
  --green:#2E7D4F;--green-chip:#E4F2EA;--red:#C8402E;--red-chip:#FBEAE7;--amber:#A87512;--amber-chip:#FFF6E2;
  --blue:#3E6FB0;--blue-chip:#E8EFF8;--aldea:#0D3F3E;--aldea-chip:#E6EFEE;--gray-band:#EEF0F2;
  --meta:#E05E14;--google:#3E6FB0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Inter",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 32px}
.disp{font-family:"Archivo",sans-serif;font-weight:850;letter-spacing:-.01em}

/* Topo (mesmo padrão da Central) */
.hero{position:relative;overflow:hidden;background:var(--navy-deep);color:#fff}
.hero::before{content:"";position:absolute;left:-240px;top:-280px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,51,.22) 0%,rgba(255,122,51,0) 62%);pointer-events:none}
.hero::after{content:"";position:absolute;right:-260px;bottom:-420px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(13,63,62,.6) 0%,rgba(13,63,62,0) 62%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.stripe{height:6px;background:linear-gradient(90deg,var(--orange),var(--orange-deep))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:20px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.08)}
.bar .molla{height:28px;width:auto;display:block}
#topbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pdf-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);font-family:"Archivo",sans-serif;font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border-radius:8px;cursor:pointer;transition:all .2s}
.pdf-btn svg{width:14px;height:14px}
.pdf-btn:hover{background:var(--orange);border-color:var(--orange);color:#fff}
.intro{display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:end;padding-top:44px;padding-bottom:44px}
.chip{display:inline-block;background:rgba(255,122,51,.14);color:var(--orange);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;padding:7px 16px;border-radius:999px}
h1{margin-top:16px;font-family:"Archivo",sans-serif;font-weight:850;font-size:clamp(34px,4.6vw,54px);line-height:1.02;letter-spacing:-.015em}
h1 em{font-style:normal;color:var(--orange)}
.lead{margin-top:14px;max-width:620px;font-size:15.5px;line-height:1.55;color:rgba(255,255,255,.72)}
.edbox{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:18px}
.edbox label{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:rgba(255,255,255,.5);margin-bottom:8px}
.edbox select{width:100%;background:var(--navy-deep);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}
.edmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.edmeta span{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.78);background:rgba(255,255,255,.08);padding:4px 10px;border-radius:999px}
.edmeta span.t{background:var(--orange);color:#fff}
.edtitle{margin-top:10px;font-size:13.5px;color:rgba(255,255,255,.75);line-height:1.45}

/* Barra de filtros + capítulos */
.sticky{position:sticky;top:0;z-index:20;background:rgba(245,245,242,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;padding-top:14px;padding-bottom:10px}
.fgroup{display:flex;flex-direction:column;gap:5px}
.fgroup>span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--soft)}
.seg{display:inline-flex;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:none;background:none;padding:6px 12px;border-radius:7px;font-size:13px;font-weight:700;color:var(--soft);cursor:pointer}
.seg button.on{background:var(--navy-deep);color:#fff}
.sel{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;min-width:0;max-width:100%}
.dates{display:flex;gap:6px;align-items:center}
.dates input{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px}
.dates[hidden]{display:none}
.fnote{flex-basis:100%;font-size:12.5px;color:var(--soft);display:flex;gap:8px;align-items:flex-start}
.fnote b{color:var(--ink)}
.chapnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.chapnav::-webkit-scrollbar{display:none}
.chapnav a{flex-shrink:0;text-decoration:none;font-size:13px;font-weight:700;color:var(--soft);padding:10px 12px 12px;border-bottom:3px solid transparent;white-space:nowrap}
.chapnav a b{font-family:"Archivo",sans-serif;font-weight:850;color:var(--soft-light);margin-right:6px}
.chapnav a:hover{color:var(--ink)}
.chapnav a.on{color:var(--ink);border-color:var(--orange)}
.chapnav a.on b{color:var(--orange-deep)}

/* Capítulos */
main{flex:1;padding:28px 0 64px}
.chapter{display:none}
.chapter.on{display:block}
.ch-head{margin-bottom:22px}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--orange-deep);font-weight:800;margin-bottom:10px}
.eyebrow::before{content:"";width:36px;height:3px;background:var(--orange)}
h2{font-family:"Archivo",sans-serif;font-weight:850;font-size:clamp(26px,3vw,36px);line-height:1.08;letter-spacing:-.01em}
.ch-lead{margin-top:10px;font-size:15px;color:var(--soft);max-width:860px}
h3.sec{font-family:"Archivo",sans-serif;font-weight:800;font-size:19px;margin:34px 0 4px;display:flex;align-items:center;gap:10px}
.sec-sub{font-size:13.5px;color:var(--soft);margin-bottom:14px;max-width:860px}
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.kpi{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px 13px;position:relative;min-width:0}
.kpi .l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:800;display:flex;align-items:center;gap:6px;justify-content:space-between}
.kpi .v{font-family:"Archivo",sans-serif;font-weight:850;font-size:26px;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v.na{color:var(--soft-light);font-size:18px}
.kpi .d{margin-top:6px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.kpi .d small{font-weight:600;color:var(--soft)}
.kpi .n{font-size:11.5px;color:var(--soft);margin-top:4px;line-height:1.35}
.kpi.meta{border-top:4px solid var(--meta)}.kpi.google{border-top:4px solid var(--google)}
.up-good{color:var(--green)}.up-bad{color:var(--red)}.neutral{color:var(--soft)}
.o{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.04em;border:1px solid var(--line);color:var(--soft);background:var(--bg);cursor:help;flex-shrink:0}
.o.A{background:var(--orange-chip);border-color:#FFD9C2;color:var(--orange-deep)}
.o.C{background:var(--blue-chip);border-color:#CFDDF0;color:var(--blue)}
.o.R{background:var(--aldea-chip);border-color:#C9DCDA;color:var(--aldea)}
.plat{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.plat i{width:9px;height:9px;border-radius:3px;display:inline-block}
.plat.meta i{background:var(--meta)}.plat.google i{background:var(--google)}.plat.ambas i{background:linear-gradient(90deg,var(--meta) 50%,var(--google) 50%)}

/* Cartões de leitura */
.ins{background:var(--paper);border:1.5px solid var(--line);border-left:5px solid var(--soft-light);border-radius:14px;padding:15px 16px}
.ins .h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ins .tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--soft);display:flex;align-items:center;gap:6px}
.ins .tag svg{width:14px;height:14px}
.ins h4{font-size:15px;font-weight:800;line-height:1.3;margin:6px 0 4px}
.ins p{font-size:13.5px;color:var(--soft);line-height:1.5}
.ins.bom{border-left-color:var(--green)}.ins.bom .tag{color:var(--green)}
.ins.atencao{border-left-color:var(--red)}.ins.atencao .tag{color:var(--red)}
.ins.oportunidade{border-left-color:var(--orange)}.ins.oportunidade .tag{color:var(--orange-deep)}
.qa{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.qa .q{display:flex;gap:10px;align-items:baseline;font-family:"Archivo",sans-serif;font-weight:800;font-size:15.5px;line-height:1.3}
.qa .q b{color:var(--orange-deep);font-size:13px;min-width:20px}
.qa p{margin-top:6px;font-size:13.5px;color:var(--soft);line-height:1.55;padding-left:30px}
.read{background:var(--orange-chip);border-left:5px solid var(--orange);border-radius:0 12px 12px 0;padding:14px 18px;font-size:14px;line-height:1.55}
.read b.k{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange-deep);font-weight:800;margin-bottom:4px}
.empty{background:var(--paper);border:1.5px dashed #D6D3C9;border-radius:14px;padding:22px;text-align:center;color:var(--soft);font-size:13.5px}
.empty b{display:block;font-family:"Archivo",sans-serif;font-size:16px;color:var(--ink);margin-bottom:4px}
ol.prio{list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:8px}
ol.prio li{counter-increment:p;display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600}
ol.prio li::before{content:counter(p);font-family:"Archivo",sans-serif;font-weight:850;color:#fff;background:var(--orange-deep);min-width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px}
ul.chk{list-style:none;display:flex;flex-direction:column;gap:8px}
ul.chk li{display:flex;gap:10px;font-size:13.5px;line-height:1.45}
ul.chk li::before{content:"";width:16px;height:16px;min-width:16px;margin-top:2px;border:2px solid var(--soft-light);border-radius:5px}

/* Tabelas */
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px;background:var(--paper)}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.t th{position:sticky;top:0;background:var(--navy);color:#fff;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;text-align:right;padding:10px 12px;white-space:nowrap;cursor:pointer;user-select:none}
.t th:first-child,.t td:first-child{text-align:left}
.t th.l,.t td.l{text-align:left}
.t th[data-s]::after{content:" ↕";opacity:.4}
.t th.asc::after{content:" ↑";opacity:1}.t th.desc::after{content:" ↓";opacity:1}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;white-space:nowrap}
.t td.wrap{white-space:normal;min-width:220px}
.t tr:last-child td{border-bottom:none}
.t tr.tot td{background:var(--bg);font-weight:800}
.t .nm{font-weight:700;white-space:normal;min-width:200px;max-width:340px}
.t .nm small{display:block;font-weight:500;color:var(--soft-light);font-size:11px;word-break:break-all}
.t td.dim{color:var(--soft-light)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
.badge.g{background:var(--green-chip);color:var(--green)}.badge.r{background:var(--red-chip);color:var(--red)}
.badge.a{background:var(--amber-chip);color:var(--amber)}.badge.o{background:var(--orange-chip);color:var(--orange-deep)}
.badge.n{background:var(--bg);color:var(--soft);border:1px solid var(--line)}.badge.b{background:var(--blue-chip);color:var(--blue)}
.badge.ok{background:var(--green);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--soft);cursor:pointer}
.tabs button.on{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff}
.tabs button span{opacity:.6;margin-left:4px}

/* Gráficos */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:#E9E7E1;stroke-width:1}
.chart text{font-family:"Inter",sans-serif;font-size:11px;fill:var(--soft)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hover-line{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--navy-deep);color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45;white-space:nowrap;box-shadow:0 8px 24px rgba(26,33,43,.25);transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;z-index:5}
.tip b{font-weight:800}
.tip.on{opacity:1}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.chart-head h4{font-size:14.5px;font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--soft);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.mini{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.mini h5{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--soft);margin-bottom:6px}
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center;font-size:13px}
.frow .bar{height:22px;border-radius:0 6px 6px 0;background:var(--meta);min-width:2px;padding:0}
.frow .bar.c{background:#C7CCD3}
.frow .lab{font-weight:700}
.frow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.frow .val small{display:block;font-weight:500;color:var(--soft);font-size:11px}

/* Linha do tempo */
.tl{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:12px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.tl .ev::before{content:"";position:absolute;left:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--orange)}
.tl .ev.mensuracao::before{border-color:var(--google)}.tl .ev.metodologia::before{border-color:var(--aldea)}.tl .ev.marco::before{border-color:var(--navy)}
.tl .ev .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--soft);font-weight:700}
.tl .ev h4{font-size:14.5px;font-weight:800;margin:4px 0 2px}
.tl .ev p{font-size:13px;color:var(--soft)}

/* Cartões responsivos (plano e negativação) */
.cards{display:flex;flex-direction:column;gap:10px}
.item{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.item h4{font-size:15px;font-weight:800;line-height:1.3}
.item .id{font-family:"Archivo",sans-serif;font-weight:850;color:var(--soft-light);font-size:12px;margin-right:6px}
.item p{font-size:13px;color:var(--soft);margin-top:4px}
.item dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;align-content:start}
.item dt{color:var(--soft);font-weight:600}
.item dd{font-weight:700}
.item .st{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.item .res{grid-column:1/-1;background:var(--bg);border-radius:10px;padding:9px 12px;font-size:13px}
.item .res b{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);display:block}
.terms{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.terms code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
details.hist{grid-column:1/-1;font-size:12.5px}
details.hist summary{cursor:pointer;font-weight:700;color:var(--orange-deep)}
details.hist ul{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:5px;border-left:2px solid var(--line);padding-left:12px}
details.hist li{color:var(--soft)}
details.hist li b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--navy-deep);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:800;font-size:13px;cursor:pointer}
.btn:hover{background:var(--orange-deep)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn svg{width:16px;height:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:s}
.steps div{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px;counter-increment:s;font-size:13px;color:var(--soft)}
.steps div b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:3px}
.steps div b::before{content:counter(s) ". ";color:var(--orange-deep)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ba .panel h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;margin-bottom:6px}
.ba .antes h4{color:var(--red)}.ba .agora h4{color:var(--green)}
.ba .panel p{font-size:14px;line-height:1.55}
.trans{position:relative;height:74px;margin-top:6px}
.trans .line{position:absolute;left:0;right:0;top:30px;height:4px;background:var(--line);border-radius:4px}
.trans .seg{position:absolute;top:26px;height:12px;border-radius:6px}
.trans .pt{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;font-weight:700;text-align:center;white-space:nowrap}
.trans .pt i{display:block;width:12px;height:12px;border-radius:50%;margin:20px auto 6px;border:3px solid var(--ink);background:var(--paper)}
.nav-ch{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.nav-ch a{text-decoration:none;font-weight:800;font-size:14px;color:var(--orange-deep)}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--amber-chip);border:1.5px solid #F2DDAE;border-radius:12px;padding:12px 14px;font-size:13px;color:#6B4D0E;margin-bottom:14px}
.warn svg{width:18px;height:18px;min-width:18px;color:var(--amber);margin-top:1px}
.mt{margin-top:14px}.mt2{margin-top:24px}

footer{border-top:1px solid var(--line);background:var(--paper)}
footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:20px;padding-bottom:20px;flex-wrap:wrap}
footer img{height:20px;width:auto;display:block}
footer span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--soft-light)}

@media (max-width:1020px){
  .intro{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item{grid-template-columns:1fr 1fr}
  .item>div:first-child{grid-column:1/-1}
}
@media (max-width:680px){
  .wrap{padding:0 16px}
  .sticky{position:static}
  .bar .molla{height:22px}
  .pdf-btn{padding:8px 10px}
  .pdf-btn .lbl{display:none}
  .intro{padding-top:30px;padding-bottom:30px;gap:20px}
  .g2,.g3,.g4,.ba{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:12px}
  .kpi .v{font-size:21px}
  .filters{gap:8px 10px;padding-top:10px}
  .fgroup{flex:1 1 100%}
  .fgroup .sel{width:100%}
  .seg{width:100%}.seg button{flex:1}
  .fnote{display:none}
  .sticky.open .fnote{display:flex}
  .item{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .frow{grid-template-columns:96px 1fr 92px;gap:8px;font-size:12px}
  .qa p{padding-left:0}
  h3.sec{font-size:17px}
}
@media print{
  .sticky,#topbtns,.nav-ch,.tabs,.btn{display:none!important}
  .chapter{display:block!important;break-before:page}
  .chapter:first-of-type{break-before:auto}
  body{background:#fff}
  .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<header class="hero">
  <div class="stripe"></div>
  <div class="wrap bar">
    <img class="molla" src="../assets/molla-branca.png" alt="Molla">
    <div id="topbtns">
      <button class="pdf-btn" id="imprimir" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg><span class="lbl">Imprimir</span></button>
    </div>
  </div>
  <div class="wrap intro">
    <div>
      <span class="chip">Aldea Barefoot · Reports</span>
      <h1>Report de <em>Performance</em></h1>
      <p class="lead">Acompanhamento contínuo de Meta Ads e Google Ads: o que aconteceu, o que mudou, o que recomendamos e o que depende de decisão. Cada edição fica guardada no histórico.</p>
    </div>
    <div class="edbox">
      <label for="edicao">Edição do report</label>
      <select id="edicao"></select>
      <div class="edmeta" id="edmeta"></div>
      <p class="edtitle" id="edtitle"></p>
    </div>
  </div>
</header>

<div class="sticky" id="sticky">
  <div class="wrap filters">
    <div class="fgroup"><span>Plataforma</span>
      <div class="seg" id="plat"><button data-p="todas" class="on" type="button">Todas</button><button data-p="meta" type="button">Meta Ads</button><button data-p="google" type="button">Google Ads</button></div>
    </div>
    <div class="fgroup"><span>Período</span>
      <select class="sel" id="periodo" aria-label="Período"></select>
      <div class="dates" id="pCustom" hidden><input type="date" id="pIni" aria-label="Início"><span>a</span><input type="date" id="pFim" aria-label="Fim"></div>
    </div>
    <div class="fgroup"><span>Comparar com</span>
      <select class="sel" id="comp" aria-label="Comparar com"></select>
      <div class="dates" id="cCustom" hidden><input type="date" id="cIni" aria-label="Início da comparação"><span>a</span><input type="date" id="cFim" aria-label="Fim da comparação"></div>
    </div>
    <p class="fnote" id="fnote"></p>
  </div>
  <div class="wrap"><nav class="chapnav" id="chapnav" aria-label="Capítulos"></nav></div>
</div>

<main><div class="wrap" id="conteudo"></div></main>

<footer><div class="wrap"><img src="../assets/molla-laranja.png" alt="Molla"><span>Report de Performance · Agência Molla</span></div></footer>
<div class="toast" id="toast"></div>

<script src="../assets/reports/dados-meta.js"></script>
<script src="../assets/reports/dados-google.js"></script>
<script src="../assets/reports/registro.js"></script>
<script src="../assets/reports/edicoes.js"></script>
<script>
(function(){
'use strict';
/* ====================================================================== Dados */
var META = window.RP_META || {colunas:[],linhas:[],fontes:[]};
var GOOG = window.RP_GOOGLE || {diario:[],consolidados:[],fontes:[]};
var REG = window.RP_REGISTRO || {eventos:[],negativacao:[],plano:[]};
var EDS = (window.RP_EDICOES || []).slice().sort(function(a,b){ return b.numero - a.numero; });

var COL = {}; META.colunas.forEach(function(k,i){ COL[k]=i; });
var ROWS = META.linhas.map(function(l){ var o={}; META.colunas.forEach(function(k,i){ o[k]=l[i]; }); return o; });
var DIAS = ROWS.map(function(r){ return r.d; }).sort();
var D0 = DIAS[0] || '2026-01-01', D1 = DIAS[DIAS.length-1] || D0;

var CHAPS = [
  {id:'resumo', n:'1', nome:'Resumo executivo'},
  {id:'meta', n:'2', nome:'Meta Ads'},
  {id:'mensuracao', n:'3', nome:'Estrutura e mensuração Google'},
  {id:'google', n:'4', nome:'Google Ads'},
  {id:'termos', n:'5', nome:'Termos e negativação'},
  {id:'plano', n:'6', nome:'Plano de ação'},
  {id:'historico', n:'', nome:'Histórico'},
  {id:'dados', n:'', nome:'Dados e método'}
];
var ORIG = {D:'Dado fornecido pela plataforma', C:'Métrica calculada a partir dos dados', A:'Interpretação e análise da Molla', R:'Registro da Molla (acontecimento ou decisão)'};

/* ====================================================================== Utilidades */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var nf0 = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
var nf2 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function brl(v){ return v==null||!isFinite(v) ? '—' : 'R$ '+nf2.format(v); }
function int(v){ return v==null||!isFinite(v) ? '—' : nf0.format(v); }
function pct(v,d){ return v==null||!isFinite(v) ? '—' : new Intl.NumberFormat('pt-BR',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d}).format(v)+'%'; }
function dec(v){ return v==null||!isFinite(v) ? '—' : nf2.format(v); }
function dObj(s){ var p=s.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); }
function dStr(d){ return d.toISOString().slice(0,10); }
function addD(s,n){ var d=dObj(s); d.setUTCDate(d.getUTCDate()+n); return dStr(d); }
function nDias(a,b){ return Math.round((dObj(b)-dObj(a))/864e5)+1; }
function fd(s){ var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fds(s){ var p=s.split('-'); return p[2]+'/'+p[1]; }
function per(a,b){ return a===b ? fd(a) : (a.slice(0,4)===b.slice(0,4) ? fds(a)+' a '+fd(b) : fd(a)+' a '+fd(b)); }
var MES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function oTag(o){ return o ? '<span class="o '+o+'" title="'+esc(ORIG[o]||'')+'">'+o+'</span>' : ''; }
function ico(d){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>'; }
var IC = {bom:'M20 6L9 17l-5-5', atencao:'M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z', oportunidade:'M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8', neutro:'M12 8h.01M11 12h1v4h1M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z', copy:'M9 9h11v11H9zM5 15H4V4h11v1', info:'M12 8h.01M11 12h1v4h1M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z'};
var KNOME = {bom:'Resultado positivo', atencao:'Ponto de atenção', oportunidade:'Oportunidade', neutro:'Leitura'};
function toast(t){ var e=document.getElementById('toast'); e.textContent=t; e.classList.add('on'); setTimeout(function(){ e.classList.remove('on'); },2200); }

/* ====================================================================== Taxonomia Meta */
function estrutura(c){ return /^META_ADS_/.test(c) ? 'Nova' : 'Anterior'; }
function objetivo(c){
  if (/_ENG_/.test(c)) return 'Engajamento';
  if (/_TRF_/.test(c)) return 'Tráfego';
  if (/_CONV_|_VEN_/.test(c)) return 'Vendas';
  if (/^\[Leads\]/i.test(c)) return 'Leads';
  if (/^\[Vendas\]/i.test(c)) return 'Vendas';
  return 'Outro';
}
function publico(s){
  if (/_INTER$/.test(s)) return 'Interesses (prospecção)';
  if (/_CONT-SITE$/.test(s)) return 'Visitantes do site (remarketing)';
  if (/_CARR|_CHECK|_QUENTE$/.test(s)) return 'Carrinho e checkout (remarketing)';
  if (/Lista de espera/i.test(s)) return 'Lista de espera (leads)';
  if (/Semana do Cliente/i.test(s)) return 'Semana do Cliente';
  if (/Cupons/i.test(s)) return 'Quente · teste de cupons';
  if (/Quente/i.test(s)) return 'Quente (estrutura anterior)';
  if (/Frio/i.test(s)) return 'Frio (estrutura anterior)';
  return s;
}
var FMT = {VD:'Vídeo', ST:'Estático', CAR:'Carrossel'};
function adId(a){ var m=/(A\d+-(VD|ST|CAR)-[A-Z0-9-]+)$/.exec(a); return m ? {id:m[1], formato:FMT[m[2]]} : null; }
function curto(tipo, nome){
  if (tipo==='a'){ var x=adId(nome); return x ? x.id : nome; }
  if (tipo==='s') return publico(nome);
  if (tipo==='c'){ var m=/^META_ADS_([A-Z0-9-]+)_/.exec(nome); return m ? m[1].replace(/-/g,' ') : nome; }
  return nome;
}
var PLAT = {instagram:'Instagram', facebook:'Facebook', threads:'Threads', whatsapp:'WhatsApp', audience_network:'Audience Network', messenger:'Messenger'};

/* ====================================================================== Agregação */
var SOMA = ['g','im','ck','cp','rv','atc','ic','msg','v25','v50','v75','v95','v100','eng'];
function filtra(ini,fim){ return ROWS.filter(function(r){ return r.d>=ini && r.d<=fim; }); }
function agg(rows){
  var o={n:rows.length}; SOMA.forEach(function(k){ o[k]=0; });
  var dias={};
  rows.forEach(function(r){ SOMA.forEach(function(k){ o[k]+= +r[k]||0; }); if ((+r.g||0)>0) dias[r.d]=1; });
  o.diasAtivos = Object.keys(dias).length;
  return der(o);
}
function der(o){
  o.ctr = o.im ? o.ck/o.im*100 : null; o.cpc = o.ck ? o.g/o.ck : null; o.cpm = o.im ? o.g/o.im*1000 : null;
  o.cpa = o.cp ? o.g/o.cp : null; o.roas = o.g ? o.rv/o.g : null; o.tc = o.ck ? o.cp/o.ck*100 : null;
  o.h25 = o.im ? o.v25/o.im*100 : null; o.ret = o.v25 ? o.v100/o.v25*100 : null;
  return o;
}
function grupo(rows, fn){
  var m={}; rows.forEach(function(r){ var k=fn(r); (m[k]=m[k]||[]).push(r); });
  return Object.keys(m).map(function(k){ var a=agg(m[k]); a.k=k; a.rows=m[k]; return a; });
}
function semana(d){ var x=dObj(d), wd=(x.getUTCDay()+6)%7; x.setUTCDate(x.getUTCDate()-wd); return dStr(x); }

/* ====================================================================== Estado */
var S = { ed:null, cap:'resumo', plat:'todas', pSel:'padrao', cSel:'padrao', ini:null, fim:null, cIni:null, cFim:null, tab:{} };
function ed(){ return S.ed; }

function opcoesPeriodo(){
  var e=ed(), o=[];
  if (e.padrao) o.push(['padrao','Leitura da edição · '+per(e.padrao.ini,e.padrao.fim)]);
  o.push(['edicao','Período completo da edição · '+per(e.periodo.ini,e.periodo.fim)]);
  (e.fases||[]).forEach(function(f){ o.push(['fase:'+f.id, f.nome+' · '+per(f.ini,f.fim)]); });
  o.push(['ult7','Últimos 7 dias com dados'],['ult14','Últimos 14 dias com dados'],['ult30','Últimos 30 dias com dados']);
  var meses={}; DIAS.forEach(function(d){ meses[d.slice(0,7)]=1; });
  Object.keys(meses).sort().forEach(function(m){ o.push(['mes:'+m, 'Mês de '+MES[+m.slice(5)-1]+' de '+m.slice(0,4)]); });
  o.push(['tudo','Todo o histórico · '+per(D0,D1)],['custom','Personalizado']);
  return o;
}
function opcoesComp(){
  var e=ed(), o=[];
  if (e.padrao && e.padrao.comp) o.push(['padrao','Comparação da edição · '+per(e.padrao.comp.ini,e.padrao.comp.fim)]);
  o.push(['anterior','Período anterior equivalente'],['mesant','Mesmo período do mês anterior']);
  (e.fases||[]).forEach(function(f){ o.push(['fase:'+f.id, f.nome+' · '+per(f.ini,f.fim)]); });
  o.push(['nenhum','Sem comparação'],['custom','Personalizado']);
  return o;
}
function resolvePeriodo(){
  var e=ed(), v=S.pSel, f;
  if (v==='padrao'){ S.ini=e.padrao.ini; S.fim=e.padrao.fim; }
  else if (v==='edicao'){ S.ini=e.periodo.ini; S.fim=e.periodo.fim; }
  else if (v.indexOf('fase:')===0){ f=fase(v.slice(5)); S.ini=f.ini; S.fim=f.fim; }
  else if (/^ult/.test(v)){ var n=+v.slice(3); S.fim=D1; S.ini=addD(D1,-(n-1)); }
  else if (v.indexOf('mes:')===0){ var m=v.slice(4); S.ini=m+'-01'; var d=dObj(S.ini); d.setUTCMonth(d.getUTCMonth()+1); d.setUTCDate(0); S.fim=dStr(d); }
  else if (v==='tudo'){ S.ini=D0; S.fim=D1; }
  else if (v==='custom'){ S.ini=document.getElementById('pIni').value||S.ini; S.fim=document.getElementById('pFim').value||S.fim; if (S.ini>S.fim){ var t=S.ini; S.ini=S.fim; S.fim=t; } }
  S.corte = S.fim>D1 && S.ini<=D1; if (S.corte) S.fim=D1;
  var c=S.cSel;
  if (c==='padrao'){ if (e.padrao&&e.padrao.comp){ S.cIni=e.padrao.comp.ini; S.cFim=e.padrao.comp.fim; } else { S.cSel='anterior'; c='anterior'; } }
  if (c==='anterior'){ var n2=nDias(S.ini,S.fim); S.cFim=addD(S.ini,-1); S.cIni=addD(S.cFim,-(n2-1)); }
  else if (c==='mesant'){ S.cIni=mesAntes(S.ini); S.cFim=mesAntes(S.fim); }
  else if (c.indexOf('fase:')===0){ f=fase(c.slice(5)); S.cIni=f.ini; S.cFim=f.fim; }
  else if (c==='nenhum'){ S.cIni=S.cFim=null; }
  else if (c==='custom'){ S.cIni=document.getElementById('cIni').value||S.cIni; S.cFim=document.getElementById('cFim').value||S.cFim; if (S.cIni&&S.cFim&&S.cIni>S.cFim){ var t2=S.cIni; S.cIni=S.cFim; S.cFim=t2; } }
}
function mesAntes(d){ var p=d.split('-'), y=+p[0], m=+p[1]-1, dia=+p[2]; if (m<1){ m=12; y--; } var ult=new Date(Date.UTC(y,m,0)).getUTCDate(); return y+'-'+String(m).padStart(2,'0')+'-'+String(Math.min(dia,ult)).padStart(2,'0'); }
function fase(id){ var fs=ed().fases||[]; for (var i=0;i<fs.length;i++) if (fs[i].id===id) return fs[i]; return {ini:D0,fim:D1,nome:id}; }
function overlaps(){ return S.cIni && !(S.cFim < S.ini || S.cIni > S.fim); }

/* ====================================================================== Componentes */
// dir: 1 maior é melhor · -1 menor é melhor · 0 neutro. vol: métrica de volume (normaliza por dia)
var KDEF = {
  g:{l:'Investimento', f:brl, dir:0, vol:1, o:'D'}, im:{l:'Impressões', f:int, dir:0, vol:1, o:'D'},
  ck:{l:'Cliques no link', f:int, dir:1, vol:1, o:'D'}, ctr:{l:'CTR', f:function(v){return pct(v);}, dir:1, o:'C'},
  cpc:{l:'CPC', f:brl, dir:-1, o:'C'}, cpm:{l:'CPM', f:brl, dir:-1, o:'C'},
  cp:{l:'Compras', f:int, dir:1, vol:1, o:'D'}, rv:{l:'Receita atribuída', f:brl, dir:1, vol:1, o:'D'},
  cpa:{l:'Custo por compra', f:brl, dir:-1, o:'C'}, roas:{l:'ROAS', f:dec, dir:1, o:'C'},
  atc:{l:'Adições ao carrinho', f:int, dir:1, vol:1, o:'D'}, ic:{l:'Checkouts iniciados', f:int, dir:1, vol:1, o:'D'},
  msg:{l:'Conversas iniciadas', f:int, dir:1, vol:1, o:'D'}, tc:{l:'Compra por clique', f:function(v){return pct(v);}, dir:1, o:'C'}
};
function delta(k, a, b, nA, nB){
  var def=KDEF[k]; if (!b) return '';
  var va=a[k], vb=b[k];
  if (!b.n || !b.g) return '<div class="d neutral"><small>sem entrega na comparação</small></div>';
  if (va==null || vb==null) return '<div class="d neutral"><small>sem base na comparação</small></div>';
  var norm = def.vol && nA!==nB;
  if (norm){ va=va/nA; vb=vb/nB; }
  if (vb===0) return va===0 ? '<div class="d neutral">= <small>igual</small></div>' : '<div class="d neutral"><small>antes: zero</small></div>';
  var p=(va-vb)/Math.abs(vb)*100, up=p>0;
  var cls = def.dir===0 || Math.abs(p)<0.5 ? 'neutral' : ((up?1:-1)*def.dir>0 ? 'up-good' : 'up-bad');
  var arrow = Math.abs(p)<0.5 ? '=' : (up ? '▲' : '▼');
  return '<div class="d '+cls+'">'+arrow+' '+pct(Math.abs(p),1)+' <small>'+(norm?'por dia · ':'')+'vs '+(norm&&def.f===int?dec:def.f)(norm?b[k]/nB:b[k])+(norm?'/dia':'')+'</small></div>';
}
function kpi(k, a, b, nA, nB, plat, nota){
  var def=KDEF[k], v=a[k];
  return '<div class="kpi '+(plat||'')+'"><div class="l"><span>'+def.l+'</span>'+oTag(def.o)+'</div>'+
    '<div class="v'+(v==null?' na':'')+'">'+(v==null?'sem dado':def.f(v))+'</div>'+delta(k,a,b,nA,nB)+(nota?'<div class="n">'+nota+'</div>':'')+'</div>';
}
function kpiFix(label, valor, o, plat, nota, na){
  return '<div class="kpi '+(plat||'')+'"><div class="l"><span>'+label+'</span>'+oTag(o)+'</div><div class="v'+(na?' na':'')+'">'+valor+'</div>'+(nota?'<div class="n">'+nota+'</div>':'')+'</div>';
}
function ins(i){
  var k=i.k||'neutro';
  return '<div class="ins '+k+'"><div class="h"><span class="tag">'+ico(IC[k])+KNOME[k]+'</span>'+oTag(i.o)+'</div><h4>'+esc(i.t)+'</h4><p>'+esc(i.x)+'</p></div>';
}
function insGrid(list, cols){ return list && list.length ? '<div class="grid '+(cols||'g2')+'">'+list.map(ins).join('')+'</div>' : ''; }
function sec(t, sub){ return '<h3 class="sec">'+t+'</h3>'+(sub?'<p class="sec-sub">'+sub+'</p>':''); }
function warn(t){ return '<div class="warn">'+ico(IC.atencao)+'<div>'+t+'</div></div>'; }
function empty(t,x){ return '<div class="empty"><b>'+t+'</b>'+x+'</div>'; }

/* Tabela ordenável */
var TBL = {};
function tabela(id, cols, linhas, opts){
  opts=opts||{};
  var st = TBL[id] || {k:opts.sort||null, dir:opts.dir||-1};
  TBL[id]=st;
  var ls = linhas.slice();
  if (st.k){ ls.sort(function(a,b){ var x=a[st.k], y=b[st.k]; if (x==null) x=-Infinity; if (y==null) y=-Infinity; return (typeof x==='string' ? x.localeCompare(y) : x-y)*st.dir; }); }
  var h='<div class="tw"><table class="t" data-tbl="'+id+'"><thead><tr>'+cols.map(function(c){
    var cl=(c.l?'l ':'')+(st.k===c.k?(st.dir>0?'asc':'desc'):'');
    return '<th class="'+cl+'"'+(c.k?' data-s="'+c.k+'"':'')+'>'+c.t+'</th>'; }).join('')+'</tr></thead><tbody>';

function nice(m){ if (m<=0) return 1; var p=Math.pow(10,Math.floor(Math.log10(m))), n=m/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function serie(el, cfg){
  var W=Math.max(el.clientWidth,280), H=cfg.h||220, P={l:56,r:12,t:cfg.bands&&cfg.bands.length?24:10,b:28};
  var pts=cfg.pontos, n=pts.length; if (!n){ el.innerHTML=empty('Sem dados','Nenhum dado no intervalo.'); return; }
  var vals=pts.map(function(p){ return p.v; }).filter(function(v){ return v!=null; });
  var max=nice(Math.max.apply(null, vals.concat([0]))*1.05||1);
  var iw=W-P.l-P.r, ih=H-P.t-P.b, step=iw/n;
  function x(i){ return P.l+step*i+step/2; } function y(v){ return P.t+ih-(v/max)*ih; }
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(cfg.titulo||'')+'">';
  (cfg.bands||[]).forEach(function(b){
    var i0=-1,i1=-1; pts.forEach(function(p,i){ if (p.x>=b.ini && p.x<=b.fim){ if (i0<0) i0=i; i1=i; } });
    if (i0<0) return;
    var bx=P.l+step*i0, bw=step*(i1-i0+1);
    s+='<rect x="'+bx+'" y="'+(P.t-18)+'" width="'+bw+'" height="'+(ih+18)+'" fill="'+b.cor+'" rx="4"/>';
    if (bw>60) s+='<text x="'+(bx+6)+'" y="'+(P.t-5)+'" style="font-weight:700;fill:'+(b.tcor||'#69717C')+'">'+esc(b.nome)+'</text>';
  });
  s+='<g class="grid">';
  for (var g=0; g<=4; g++){ var gv=max*g/4, gy=y(gv); s+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+gy+'" y2="'+gy+'"/><text x="'+(P.l-8)+'" y="'+(gy+4)+'" text-anchor="end">'+esc(cfg.eixo?cfg.eixo(gv):int(gv))+'</text>'; }
  s+='</g>';
  var every=Math.max(1,Math.ceil(n/(iw/58)));
  pts.forEach(function(p,i){ if (i%every===0) s+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(cfg.rotX?cfg.rotX(p.x):fds(p.x))+'</text>'; });
  var cor=cfg.cor||'#E05E14';
  if (cfg.tipo==='linha'){
    var d='', on=false;
    pts.forEach(function(p,i){ if (p.v==null){ on=false; return; } d+=(on?'L':'M')+x(i)+' '+y(p.v); on=true; });
    s+='<path d="'+d+'" fill="none" stroke="'+cor+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(function(p,i){ if (p.v!=null && (n<40 || (i>0&&pts[i-1].v==null) || (i<n-1&&pts[i+1].v==null))) s+='<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="'+(n<40?4:3)+'" fill="'+cor+'" stroke="#fff" stroke-width="2"/>'; });
  } else {
    var bw2=Math.max(2,Math.min(22,step*0.7)), r=Math.min(4,bw2/2);
    pts.forEach(function(p,i){
      if (!p.v) return; var h2=ih*(p.v/max), x0=x(i)-bw2/2, y0=P.t+ih-h2, rr=Math.min(r,h2);
      s+='<path d="M'+x0+' '+(P.t+ih)+'V'+(y0+rr)+'Q'+x0+' '+y0+' '+(x0+rr)+' '+y0+'H'+(x0+bw2-rr)+'Q'+(x0+bw2)+' '+y0+' '+(x0+bw2)+' '+(y0+rr)+'V'+(P.t+ih)+'Z" fill="'+(p.cor||cor)+'"/>';
    });
  }
  s+='<line class="hover-line" id="'+el.id+'-hl" x1="0" x2="0" y1="'+P.t+'" y2="'+(P.t+ih)+'" style="display:none"/>';
  pts.forEach(function(p,i){ s+='<rect class="hit" data-i="'+i+'" x="'+(P.l+step*i)+'" y="'+P.t+'" width="'+step+'" height="'+ih+'"/>'; });
  s+='</svg><div class="tip"></div>';
  el.innerHTML=s;
  var tip=el.querySelector('.tip'), hl=el.querySelector('.hover-line');
  el.querySelectorAll('.hit').forEach(function(rc){
    rc.addEventListener('mouseenter',function(){ mostrar(+rc.getAttribute('data-i')); });
    rc.addEventListener('touchstart',function(){ mostrar(+rc.getAttribute('data-i')); },{passive:true});
  });
  el.querySelector('svg').addEventListener('mouseleave',function(){ tip.classList.remove('on'); hl.style.display='none'; });
  function mostrar(i){
    var p=pts[i], sc=el.clientWidth/W;
    tip.innerHTML=cfg.tip(p); tip.classList.add('on');
    var tx=x(i)*sc; tx=Math.max(80,Math.min(el.clientWidth-80,tx));
    tip.style.left=tx+'px'; tip.style.top=((p.v!=null?y(p.v):P.t+ih)*sc-10)+'px';
    hl.setAttribute('x1',x(i)); hl.setAttribute('x2',x(i)); hl.style.display='';
  }
}
function hbars(itens, cor, fmt){
  var max=Math.max.apply(null,itens.map(function(i){ return i.v; }).concat([1]));

    return '<div class="frow"><span class="lab" title="'+esc(i.full||i.l)+'">'+esc(i.l)+'</span><div class="bar" style="width:'+Math.max(0.4,i.v/max*100)+'%;background:'+(i.cor||cor)+'"></div><span class="val">'+fmt(i.v)+(i.s?'<small>'+i.s+'</small>':'')+'</span></div>';

function marcar(gr){

  vend.forEach(function(g){ if (!best||g.roas>best.roas) best=g; });
  var ctrB=null; gr.forEach(function(g){ if (g.im>=1000 && g.obj!=='Engajamento' && (!ctrB||g.ctr>ctrB.ctr)) ctrB=g; });
  gr.forEach(function(g){
    var f=[];
    if (g===best) f.push('<span class="badge g">Destaque · ROAS</span>');
    if (g===ctrB && g!==best) f.push('<span class="badge g">Destaque · CTR</span>');
    if (g.g>=50 && g.cp===0 && (g.obj==='Vendas'||g.obj==='Tráfego')) f.push('<span class="badge r">Atenção · sem compra</span>');
    else if (g.im>=1000 && g.ctr<1.5) f.push('<span class="badge r">Atenção · CTR baixo</span>');

  });
}

  }).join('')+'</div>':empty('Nada neste filtro','Nenhuma ação com este critério e plataforma.');
  return h;
}

/* ---------------------------------------------------------------- Histórico */
function capHistorico(e){
  var h=cabeca('','Histórico','Edições anteriores, evolução de longo prazo, acontecimentos e decisões. Nada aqui é apagado: cada reunião acrescenta.');
  h+=sec('Edições do report');
  h+='<div class="grid g3">'+EDS.map(function(x){ return '<a class="panel" style="text-decoration:none;display:block'+(x.id===e.id?';border-color:var(--orange)':'')+'" href="#'+x.id+'/resumo"><div class="edmeta" style="margin:0 0 8px"><span class="badge o">Report '+String(x.numero).padStart(2,'0')+'</span> <span class="badge n">'+esc(x.tipo)+'</span></div><h4 style="font-size:15px;font-weight:800">'+esc(x.titulo)+'</h4><p class="sec-sub" style="margin:4px 0 0">'+per(x.periodo.ini,x.periodo.fim)+' · publicado em '+fd(x.publicado)+(x.id===e.id?' · aberta agora':'')+'</p></a>'; }).join('')+'</div>';
  // tendências
  var sem=grupo(ROWS,function(r){ return semana(r.d); }).sort(function(a,b){ return a.k<b.k?-1:1; });
  var all=[], w=semana(D0); while (w<=D1){ var f=sem.filter(function(s){ return s.k===w; })[0]||agg([]); all.push({x:w,a:f}); w=addD(w,7); }
  h+=sec('Tendência semanal do Meta Ads','Todo o histórico disponível, semana a semana. Semanas sem entrega aparecem vazias.');
  var M=[['g','Investimento',brl,'barra'],['ck','Cliques no link',int,'barra'],['cpc','CPC',brl,'linha'],['cp','Compras',int,'barra']];
  var bandas=(e.fases||[]).map(function(f,i){ return {ini:semana(f.ini),fim:semana(f.fim),nome:'',cor:i%2?'rgba(154,161,171,.10)':'rgba(255,122,51,.06)'}; });
  h+='<div class="grid g2">'+M.map(function(m){ return '<div class="mini"><h5>'+m[1]+' por semana</h5>'+chart('chH-'+m[0],{h:170,tipo:m[3]==='linha'?'linha':'barra',pontos:all.map(function(p){ return {x:p.x,v:m[3]==='linha'?p.a[m[0]]:(p.a[m[0]]||0),a:p.a}; }),eixo:m[0]==='g'?function(v){return 'R$ '+nf0.format(v);}:m[0]==='cpc'?function(v){return 'R$ '+nf2.format(v);}:null,rotX:fds,titulo:m[1],
    tip:function(p){ return '<b>Semana de '+per(p.x,addD(p.x,6))+'</b><br>'+m[1]+': '+m[2](p.v); }})+'</div>'; }).join('')+'</div>';
  h+=sec('Acontecimentos','Mudanças em campanhas, mensuração e método, em ordem de data.');
  var tf=S.tab.evTipo||'todos', T={todos:'Todos',campanha:'Campanhas',mensuracao:'Mensuração',metodologia:'Método',marco:'Marcos'};
  h+='<div class="tabs" data-tab="evTipo">'+Object.keys(T).map(function(k){ return '<button type="button" data-v="'+k+'" class="'+(k===tf?'on':'')+'">'+T[k]+'</button>'; }).join('')+'</div>';
  h+=linhaTempo(REG.eventos.filter(function(v){ return (tf==='todos'||v.tipo===tf) && platOk(v.plataforma); }));
  h+=sec('Decisões e mudanças de status','Tudo o que mudou nas recomendações de negativação e no plano de ação, do mais recente ao mais antigo.');
  var dec2=[]; REG.negativacao.forEach(function(n){ n.historico.forEach(function(x){ dec2.push({d:x.data,id:n.id,o:'Negativação · '+n.familia,s:x.status,n:x.nota,por:x.por}); }); });
  REG.plano.forEach(function(p){ if (!platOk(p.plataforma)) return; p.historico.forEach(function(x){ dec2.push({d:x.data,id:p.id,o:p.acao,s:x.status,n:x.nota}); }); });
  dec2.sort(function(a,b){ return a.d<b.d?1:a.d>b.d?-1:a.id<b.id?-1:1; });
  h+=tabela('dec',[{t:'Data',l:1,f:function(r){return fd(r.d);}},{t:'Item',l:1,f:function(r){return '<b>'+r.id+'</b>';}},{t:'Assunto',l:1,cls:'wrap',f:function(r){return esc(r.o);}},{t:'Status',l:1,f:function(r){return '<span class="badge '+(NST[r.s]||PST[r.s]||'n')+'">'+esc(r.s)+'</span>';}},{t:'Nota',l:1,cls:'wrap',f:function(r){return esc((r.por?r.por+' · ':'')+(r.n||''));}}],dec2,{});
  var res=REG.plano.filter(function(p){ return p.resultado && platOk(p.plataforma); });
  h+=sec('Ações implementadas e o que produziram');
  h+=res.length?'<div class="grid g2">'+res.map(function(p){ return ins({k:'neutro',o:'C',t:p.id+' · '+p.acao,x:p.resultado}); }).join('')+'</div>':empty('Ainda sem resultados medidos','Aparecem aqui conforme as ações forem implementadas e lidas.');
  return h;
}
function linhaTempo(evs){
  if (!evs.length) return empty('Nada registrado','Nenhum acontecimento com este filtro.');
  var T={campanha:'Campanha',mensuracao:'Mensuração',metodologia:'Método',marco:'Marco'};
  return '<div class="tl">'+evs.slice().sort(function(a,b){ return a.data<b.data?1:a.data>b.data?-1:0; }).map(function(v){
    return '<div class="ev '+v.tipo+'"><div class="top"><span>'+(v.fim?per(v.data,v.fim):fd(v.data))+'</span><span class="badge n">'+T[v.tipo]+'</span><span class="plat '+v.plataforma+'"><i></i>'+({meta:'Meta',google:'Google',ambas:'Meta e Google'}[v.plataforma])+'</span>'+oTag(v.origem)+(v.pendente?'<span class="badge a">Em aberto</span>':'')+'</div><h4>'+esc(v.titulo)+'</h4><p>'+esc(v.texto)+'</p></div>';
  }).join('')+'</div>';
}

/* ---------------------------------------------------------------- Dados e método */
function capDados(e){
  var h=cabeca('','Dados e método','De onde vêm os números, o que foi conferido e as regras usadas para comparar períodos.');
  h+=sec('Origem de cada informação','Todo número e todo texto do report leva uma destas marcas.');
  h+='<div class="grid g4">'+['D','C','A','R'].map(function(o){ return '<div class="panel"><div style="display:flex;gap:8px;align-items:center">'+oTag(o)+'<b style="font-size:14px">'+ORIG[o]+'</b></div><p class="sec-sub" style="margin:6px 0 0">'+{D:'Copiado da exportação, sem alteração.',C:'Conta feita sobre dados fornecidos (CTR, CPC, CPA, ROAS, taxas).',A:'Leitura da Molla. Pode ser contestada e revisada.',R:'Fato informado pela Molla: lançamentos, mudanças, decisões.'}[o]+'</p></div>'; }).join('')+'</div>';
  var fontes=(META.fontes||[]).concat(GOOG.fontes||[]);
  h+=sec('Arquivos recebidos','Os originais ficam guardados pela Molla. A conferência compara o total do arquivo com a soma das linhas.');
  h+=tabela('fontes',[{t:'Plataforma',l:1,f:function(r){return '<span class="plat '+r.plataforma+'"><i></i>'+(r.plataforma==='meta'?'Meta':'Google')+'</span>';}},{t:'Arquivo',l:1,cls:'wrap',f:function(r){return esc(r.arquivo)+(r.observacao?'<br><small class="dim">'+esc(r.observacao)+'</small>':'');}},
    {t:'Período',l:1,f:function(r){return per(r.ini,r.fim);}},{t:'Recebido',l:1,f:function(r){return fd(r.recebido);}},{t:'Nível',l:1,f:function(r){return esc(r.nivel);}},{t:'Linhas',f:function(r){return int(r.linhas);}},
    {t:'Investimento',f:function(r){return brl(r.gastoSoma);}},{t:'Conferência',l:1,f:function(r){ return r.plataforma==='meta'?(r.confere?'<span class="badge g">Total confere</span>':'<span class="badge r">Diverge</span>'):(r.gastoArquivo==null?'<span class="badge n">Sem linha de total</span>':''); }}],fontes,{});
  // verificações automáticas
  var chaves={}, dup=0; ROWS.forEach(function(r){ var k=[r.d,r.c,r.s,r.a,r.p].join('|'); if (chaves[k]) dup++; chaves[k]=1; });
  var lacunas=[], d=D0, ativo={}; ROWS.forEach(function(r){ if (r.g>0) ativo[r.d]=1; });
  var ini=null; while (d<=D1){ if (!ativo[d]){ if (!ini) ini=d; } else if (ini){ lacunas.push([ini,addD(d,-1)]); ini=null; } d=addD(d,1); }
  var atr={}; ROWS.forEach(function(r){ atr[r.at]=(atr[r.at]||0)+1; });
  var gf=(GOOG.fontes||[]);
  var checks=[
    {ok:dup===0, t:'Duplicidade no Meta', x:dup===0?'Nenhuma linha repetida (dia, campanha, conjunto, anúncio e posicionamento).':dup+' linhas repetidas encontradas.'},
    {ok:lacunas.length===0, t:'Dias sem entrega no Meta', x:lacunas.length?lacunas.map(function(l){ return per(l[0],l[1])+' ('+nDias(l[0],l[1])+' dias)'; }).join(' · '):'Nenhum dia sem entrega no intervalo.'},
    {ok:Object.keys(atr).length<2, t:'Janelas de atribuição', x:Object.keys(atr).map(function(k){ return k+' ('+atr[k]+' linhas)'; }).join(' · ')+'. 7C = clique de 7 dias · 1V = visualização de 1 dia · 1VE = visualização com engajamento de 1 dia · 1C = clique de 1 dia.'},
    {ok:false, t:'Alcance', x:'Alcance não se soma entre dias e anúncios (a mesma pessoa aparece em vários). O report usa apenas o alcance único informado no total do arquivo: '+int((META.fontes[0]||{}).alcanceUnicoArquivo)+' pessoas no período do arquivo.'},
    {ok:gf.every(function(f){ return f.temDia; }), t:'Google por dia', x:gf.every(function(f){ return f.temDia; })?'Exportação diária disponível.':'Exportação só consolidada: sem evolução diária e sem separação antes e depois da régua nova.'},
    {ok:gf.some(function(f){ return f.temValorConversao; }), t:'Valor de conversão do Google', x:gf.some(function(f){ return f.temValorConversao; })?'Disponível.':'Ausente: ROAS e receita do Google não podem ser calculados.'}
  ];
  h+=sec('Verificações automáticas','Rodam toda vez que a página abre, sobre os dados atuais.');
  h+='<div class="grid g2">'+checks.map(function(c){ return '<div class="ins '+(c.ok?'bom':'atencao')+'"><div class="h"><span class="tag">'+ico(c.ok?IC.bom:IC.atencao)+(c.ok?'Ok':'Atenção')+'</span>'+oTag('C')+'</div><h4>'+c.t+'</h4><p>'+esc(c.x)+'</p></div>'; }).join('')+'</div>';
  // fotografia
  var fA=e.fotografia&&e.fotografia.meta, now=agg(filtra(e.periodo.ini,e.periodo.fim));
  if (fA){
    var dif=Math.abs(now.g-fA.gasto)>0.05||now.cp!==fA.compras;
    h+=sec('Fotografia da edição','Números do período da edição no dia da publicação, guardados para auditoria.');
    h+=(dif?warn('Os dados deste período mudaram depois da publicação (reexportação com conversões atrasadas). Publicação: '+brl(fA.gasto)+' e '+fA.compras+' compras. Hoje: '+brl(now.g)+' e '+now.cp+' compras.'):'<div class="ins bom"><div class="h"><span class="tag">'+ico(IC.bom)+'Base intacta</span></div><p>Meta no período da edição: '+brl(now.g)+', '+int(now.ck)+' cliques, '+now.cp+' compras e '+brl(now.rv)+' de receita, iguais à publicação.</p></div>');
  }
  h+=sec('Regras de comparação');
  h+='<div class="panel"><ul class="chk">'+[
    'Períodos com durações diferentes são comparados pela média diária nos volumes (investimento, cliques, compras). Taxas (CTR, CPC, CPA, ROAS) são comparadas direto.',
    'O padrão é comparar com o período anterior de mesma duração. Em edições mensais, também com o mesmo período do mês anterior.',
    'Se a comparação não teve entrega, o report diz isso em vez de mostrar variação.',
    'Períodos que se sobrepõem são sinalizados no topo da página.',
    'Conversões do Google não se comparam entre réguas diferentes (ver capítulo 3). Cliques, impressões, CTR e CPC, sim.',
    'Campanhas com objetivos diferentes (vendas, tráfego, engajamento, leads) não são comparadas pelo custo do clique.',
    'Cada reexportação substitui apenas os dias que ela cobre: não existe soma em dobro.'
  ].map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ul></div>';
  h+=sec('Modalidades de acompanhamento','Mesma estrutura visual; muda a profundidade.');
  h+=tabela('mod',[{t:'Modalidade',l:1,f:function(r){return '<b>'+r.m+'</b>';}},{t:'Comparação padrão',l:1,cls:'wrap',f:function(r){return r.c;}},{t:'Foco',l:1,cls:'wrap',f:function(r){return r.f;}},{t:'Capítulos com análise completa',l:1,cls:'wrap',f:function(r){return r.cap;}}],[
    {m:'Semanal',c:'7 dias anteriores',f:'Evolução operacional, resultados recentes, otimizações feitas e pendências.',cap:'Resumo, Meta, Google, Termos (revisão semanal) e Plano'},
    {m:'Quinzenal',c:'14 dias anteriores',f:'Tendências, aprendizados e ajustes de estratégia.',cap:'Todos, com leitura de públicos e criativos'},
    {m:'Mensal',c:'Mês anterior e mesmo período do mês anterior',f:'Análise executiva, comparativos e planejamento do mês seguinte.',cap:'Todos, com redistribuição de verba e revisão do plano'}],{});
  h+=sec('Definições');
  h+=tabela('def',[{t:'Indicador',l:1,f:function(r){return '<b>'+r[0]+'</b>';}},{t:'Como é calculado',l:1,cls:'wrap',f:function(r){return r[1];}}],[
    ['CTR','Cliques no link ÷ impressões'],['CPC','Investimento ÷ cliques no link'],['CPM','Investimento ÷ impressões × 1.000'],
    ['Custo por compra (CPA)','Investimento ÷ compras atribuídas'],['ROAS','Receita atribuída ÷ investimento'],['Compra por clique','Compras ÷ cliques no link'],
    ['Chegam a 25%','Reproduções de 25% do vídeo ÷ impressões'],['Vão até o fim','Reproduções de 100% ÷ reproduções de 25%'],
    ['Conversões registradas (Google)','Coluna Conversões do Google Ads. Até a régua nova, pode incluir carrinho e checkout.']],{});
  h+=sec('Como uma nova edição entra','Fluxo de atualização a cada reunião.');
  h+='<div class="steps">'+[['Exportar','Meta: relatório por dia, nível anúncio, com posicionamento. Google: campanhas por dia com valor de conversão, conversões por ação e termos de pesquisa.'],['Converter','A Molla roda o conversor, que acrescenta os dias novos e substitui só os dias reexportados.'],['Registrar','Acontecimentos, mudanças de mensuração e decisões da reunião entram no registro, com data.'],['Analisar','Nova edição com período, comparação, textos e fotografia. As anteriores não são tocadas.'],['Publicar','Os arquivos sobem para a Central. O report abre na edição mais recente.']].map(function(s){ return '<div><b>'+s[0]+'</b>'+s[1]+'</div>'; }).join('')+'</div>';
  return h;
}

/* ====================================================================== Eventos de interface */
function ligar(){
  root.querySelectorAll('[data-tab]').forEach(function(box){
    box.addEventListener('click',function(ev){ var b=ev.target.closest('button'); if (!b) return; S.tab[box.getAttribute('data-tab')]=b.getAttribute('data-v'); var y=window.scrollY; render(); window.scrollTo(0,y); });
  });
  root.querySelectorAll('table.t').forEach(function(tb){
    tb.querySelectorAll('th[data-s]').forEach(function(th){ th.addEventListener('click',function(){
      var id=tb.getAttribute('data-tbl'), k=th.getAttribute('data-s'), st=TBL[id]||{};
      TBL[id]={k:k, dir:st.k===k?-st.dir:-1}; var y=window.scrollY; render(); window.scrollTo(0,y);
    }); });
  });
  var cp=document.getElementById('copiarNeg');
  if (cp) cp.onclick=function(){
    var pend=REG.negativacao.filter(function(n){ return n.status==='Pendente'; });
    var txt='Oi, pessoal! Seguem as negativações do Google Ads que precisam da validação de vocês antes de entrar na conta:\n\n'+
      pend.map(function(n){ return n.id+' · '+n.familia+': '+n.termos.join(', '); }).join('\n')+
      '\n\nDá para responder com o código e "aprovo" ou "não aprovo" (ex.: N03 não aprovo). Os detalhes e a justificativa de cada uma estão no Report de Performance, na Central.';
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){ toast('Texto copiado'); },function(){ window.prompt('Copie o texto:',txt); });
  };
}
document.getElementById('plat').addEventListener('click',function(ev){
  var b=ev.target.closest('button'); if (!b) return; S.plat=b.getAttribute('data-p');
  [].forEach.call(this.children,function(x){ x.classList.toggle('on',x===b); }); render();
});
function preencherSelects(){
  var p=document.getElementById('periodo'), c=document.getElementById('comp');
  p.innerHTML=opcoesPeriodo().map(function(o){ return '<option value="'+o[0]+'">'+esc(o[1])+'</option>'; }).join('');
  c.innerHTML=opcoesComp().map(function(o){ return '<option value="'+o[0]+'">'+esc(o[1])+'</option>'; }).join('');
  p.value=S.pSel; c.value=S.cSel;
}
document.getElementById('periodo').onchange=function(){
  S.pSel=this.value; var cu=this.value==='custom'; document.getElementById('pCustom').hidden=!cu;
  if (cu){ document.getElementById('pIni').value=S.ini; document.getElementById('pFim').value=S.fim; }
  var c=document.getElementById('comp'); if (S.pSel!=='padrao' && S.cSel==='padrao'){ S.cSel='anterior'; c.value='anterior'; }
  render();
};
document.getElementById('comp').onchange=function(){
  S.cSel=this.value; var cu=this.value==='custom'; document.getElementById('cCustom').hidden=!cu;
  if (cu){ document.getElementById('cIni').value=S.cIni||addD(S.ini,-7); document.getElementById('cFim').value=S.cFim||addD(S.ini,-1); }
  render();
};
['pIni','pFim','cIni','cFim'].forEach(function(id){ var el=document.getElementById(id); el.min=D0; el.max=D1; el.onchange=render; });
document.getElementById('edicao').onchange=function(){ location.hash=this.value+'/'+S.cap; };
document.getElementById('imprimir').onclick=function(){
  var cap=S.cap, html='';
  CH=[]; resolvePeriodo();
  var nA=nDias(S.ini,S.fim), nB=S.cIni?nDias(S.cIni,S.cFim):0, e=ed();
  var fn={resumo:capResumo, meta:capMeta, mensuracao:capMensuracao, google:capGoogle, termos:capTermos, plano:capPlano, historico:capHistorico, dados:capDados};
  CHAPS.forEach(function(c){ html+='<section class="chapter on">'+fn[c.id](e,nA,nB)+'</section>'; });
  root.innerHTML=html; desenhar();
  setTimeout(function(){ window.print(); S.cap=cap; render(); },400);
};
var rz; window.addEventListener('resize',function(){ clearTimeout(rz); rz=setTimeout(desenhar,150); });

function rota(){
  var h=location.hash.replace('#','').split('/'), id=h[0], cap=h[1];
  var e=EDS.filter(function(x){ return x.id===id; })[0]||EDS[0];
  var mudou=!S.ed||S.ed.id!==e.id;
  S.ed=e; S.cap=CHAPS.some(function(c){ return c.id===cap; })?cap:(mudou?'resumo':S.cap);
  if (mudou){ S.pSel=e.padrao?'padrao':'edicao'; S.cSel=e.padrao&&e.padrao.comp?'padrao':'anterior'; document.getElementById('edicao').value=e.id; preencherSelects(); document.getElementById('pCustom').hidden=true; document.getElementById('cCustom').hidden=true; }
  render();
  if (!mudou || cap) { var st=document.getElementById('sticky'); if (window.scrollY>st.offsetTop) window.scrollTo(0,st.offsetTop); }
}
if (!EDS.length){ root.innerHTML='<div class="empty"><b>Nenhuma edição publicada</b>Os reports aparecem aqui assim que a primeira edição for cadastrada.</div>'; return; }
document.getElementById('edicao').innerHTML=EDS.map(function(x){ return '<option value="'+x.id+'">Report '+String(x.numero).padStart(2,'0')+' · '+({semanal:'Semanal',quinzenal:'Quinzenal',mensal:'Mensal'}[x.tipo]||x.tipo)+' · '+per(x.periodo.ini,x.periodo.fim)+'</option>'; }).join('');
window.addEventListener('hashchange',rota);
rota();
})();
