<style>
  :root{
    --ink:#1E242C; --navy:#222A35; --navy-deep:#1A212B; --paper:#FFFFFF; --bg:#F5F5F2;
    --soft:#69717C; --soft-light:#9AA1AB; --line:#E5E3DC;
    --orange:#FF7A33; --orange-deep:#E05E14; --orange-chip:#FFF1E8;
    --aldea:#0D3F3E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Inter",Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
  a{color:inherit;}
  .wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 32px;}

  /* Topo */
  .hero{position:relative;overflow:hidden;background:var(--navy-deep);color:#fff;}
  .hero::before{content:"";position:absolute;left:-240px;top:-280px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle, rgba(255,122,51,.22) 0%, rgba(255,122,51,0) 62%);pointer-events:none;}
  .hero::after{content:"";position:absolute;right:-260px;bottom:-420px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle, rgba(13,63,62,.6) 0%, rgba(13,63,62,0) 62%);pointer-events:none;}
  .hero > *{position:relative;z-index:1;}
  .stripe{height:6px;background:linear-gradient(90deg,var(--orange),var(--orange-deep));}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:22px;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.08);}
  .bar .molla{height:30px;width:auto;display:block;}
  .user{display:flex;align-items:center;gap:14px;font-size:13.5px;color:rgba(255,255,255,.7);}
  .user b{color:#fff;font-weight:700;}
  .out{background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.75);font-family:"Archivo",sans-serif;font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:9px 16px;border-radius:8px;cursor:pointer;transition:all .2s;}
  .out:hover{background:var(--orange);border-color:var(--orange);color:#fff;}
  .intro{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding-top:56px;padding-bottom:56px;}
  .chip{display:inline-block;background:rgba(255,122,51,.14);color:var(--orange);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;padding:7px 16px;border-radius:999px;}
  h1{margin-top:18px;font-family:"Archivo",sans-serif;font-weight:850;font-size:clamp(36px,5vw,58px);line-height:1.02;letter-spacing:-.015em;}
  h1 em{font-style:normal;color:var(--orange);}
  .lead{margin-top:16px;max-width:560px;font-size:16px;line-height:1.55;color:rgba(255,255,255,.72);}
  .client{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0;}
  .client span{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:rgba(255,255,255,.45);}
  .client img{height:26px;width:auto;opacity:.92;}

  /* Categorias */
  .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-34px;position:relative;z-index:2;}
  .cat{appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(26,33,43,.06);transition:border-color .2s, box-shadow .2s, transform .15s;}
  .cat:hover{border-color:rgba(255,122,51,.55);box-shadow:0 14px 34px rgba(26,33,43,.1);}
  .cat.on{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,122,51,.14),0 14px 34px rgba(26,33,43,.1);}
  .cat:focus-visible{outline:3px solid rgba(255,122,51,.5);outline-offset:2px;}
  .cat-top{display:flex;align-items:center;justify-content:space-between;}
  .ico{width:42px;height:42px;border-radius:12px;background:var(--orange-chip);color:var(--orange-deep);display:flex;align-items:center;justify-content:center;}
  .ico svg{width:21px;height:21px;}
  .count{font-family:"Archivo",sans-serif;font-weight:850;font-size:26px;color:var(--ink);}
  .cat h2{font-family:"Archivo",sans-serif;font-weight:800;font-size:17px;}
  .cat p{font-size:13px;line-height:1.45;color:var(--soft);}

  /* Lista */
  main{flex:1;padding-bottom:64px;}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:48px;margin-bottom:20px;flex-wrap:wrap;}
  .head h3{font-family:"Archivo",sans-serif;font-weight:850;font-size:24px;letter-spacing:-.01em;}
  .all{appearance:none;background:none;border:none;font:inherit;font-size:13px;font-weight:700;color:var(--orange-deep);cursor:pointer;padding:4px 0;}
  .all[hidden]{display:none;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:box-shadow .2s, transform .15s, border-color .2s;}
  .card:hover{box-shadow:0 18px 40px rgba(26,33,43,.12);transform:translateY(-2px);border-color:#D9D6CC;}
  .card:focus-visible{outline:3px solid rgba(255,122,51,.5);outline-offset:2px;}
  .cover{position:relative;height:132px;background:var(--navy-deep);overflow:hidden;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;}
  .cover::before{content:"";position:absolute;right:-90px;top:-120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle, rgba(255,122,51,.35) 0%, rgba(255,122,51,0) 65%);}
  .cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--orange),var(--orange-deep));}
  .cover > *{position:relative;}
  .tag{align-self:flex-start;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:6px 12px;border-radius:999px;}
  .cover .big{font-family:"Archivo",sans-serif;font-weight:850;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);}
  .cover svg.mark{position:absolute;right:22px;bottom:22px;width:44px;height:44px;color:var(--orange);opacity:.9;}
  .new{position:absolute;top:20px;right:22px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;background:var(--orange);color:#fff;padding:5px 10px;border-radius:999px;}
  .info{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .info h4{font-family:"Archivo",sans-serif;font-weight:800;font-size:19px;line-height:1.2;}
  .info p{font-size:14px;line-height:1.5;color:var(--soft);}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .meta span{font-size:12px;font-weight:600;color:var(--soft);background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:999px;}
  .open{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--orange-deep);}
  .open svg{width:16px;height:16px;transition:transform .2s;}
  .card:hover .open svg{transform:translateX(3px);}
  .empty{grid-column:1/-1;background:var(--paper);border:1.5px dashed var(--line);border-radius:18px;padding:40px 24px;text-align:center;color:var(--soft);}
  .empty b{display:block;font-family:"Archivo",sans-serif;font-size:18px;color:var(--ink);margin-bottom:6px;}
  .group{margin-top:40px;}
  .group:first-child{margin-top:0;}
  .group-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .group-h h5{font-family:"Archivo",sans-serif;font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);}
  .group-h::after{content:"";flex:1;height:1px;background:var(--line);}

  footer{border-top:1px solid var(--line);background:var(--paper);}
  footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:22px;padding-bottom:22px;flex-wrap:wrap;}
  footer img{height:20px;width:auto;display:block;}
  footer span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--soft-light);}

  @media (max-width:980px){ .cats{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){
    .wrap{padding:0 16px;}
    .bar .molla{height:24px;}
    .user .hello{display:none;}
    .intro{flex-direction:column;align-items:flex-start;padding-top:40px;padding-bottom:52px;}
    .client{align-items:flex-start;}
    .cats{grid-template-columns:1fr 1fr;gap:10px;}
    .cat{padding:16px;}
    .cat p{display:none;}
    .grid{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;} }
</style>
</head>
<body>
  <header class="hero">
    <div class="stripe"></div>
    <div class="wrap bar">
      <img class="molla" src="assets/molla-branca.png" alt="Molla">
      <div class="user">
        <span class="hello">Olá, <b id="nome">cliente</b></span>
        <button class="out" id="sair" type="button">Sair</button>
      </div>
    </div>
    <div class="wrap intro">
      <div>
        <span class="chip">Aldea Barefoot · 2026</span>
        <h1>Central do <em>Cliente</em></h1>
        <p class="lead">Todos os materiais do nosso trabalho em um só lugar: planejamento, conteúdos, reports e estudos, atualizados ao longo do atendimento.</p>
      </div>
      <div class="client">
        <span>Cliente</span>
        <img src="assets/aldea-wordmark-branco.png" alt="Aldea Barefoot">
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <nav class="cats" id="cats" aria-label="Categorias"></nav>
      <div class="head">
        <h3 id="titulo">Todos os materiais</h3>
        <button class="all" id="todos" type="button" hidden>Ver todas as categorias</button>
      </div>
      <div id="lista"></div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <img src="assets/molla-laranja.png" alt="Molla">
      <span>Central do Cliente · Agência Molla</span>
    </div>
  </footer>

<script src="assets/materiais.js"></script>
<script>
(function(){
  var CATS = window.CATEGORIAS || [], MATS = (window.MATERIAIS || []).slice();
  MATS.sort(function(a,b){ return (b.data||'').localeCompare(a.data||''); });
  var catsEl = document.getElementById('cats'), lista = document.getElementById('lista');
  var titulo = document.getElementById('titulo'), todos = document.getElementById('todos');

  var n = sessionStorage.getItem('aldea_nome');
  if (n) document.getElementById('nome').textContent = n.split(' ')[0];
  document.getElementById('sair').onclick = function(){ sessionStorage.clear(); location.replace('index.html'); };

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function icon(d, cls){ return '<svg class="'+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>'; }
  function cat(id){ for (var i=0;i<CATS.length;i++) if (CATS[i].id===id) return CATS[i]; return {id:id,nome:id,icone:''}; }
  function doCat(id){ return MATS.filter(function(m){ return m.categoria===id; }); }
  var recente = MATS[0];

  catsEl.innerHTML = CATS.map(function(c){
    var q = doCat(c.id).length;
    return '<button class="cat" type="button" data-cat="'+c.id+'" aria-pressed="false">'+
      '<div class="cat-top"><span class="ico">'+icon(c.icone)+'</span><span class="count">'+q+'</span></div>'+
      '<h2>'+esc(c.nome)+'</h2><p>'+esc(c.descricao)+'</p></button>';
  }).join('');

  function card(m){
    var c = cat(m.categoria);
    var meta = [m.dataTexto].concat(m.detalhes||[]).filter(Boolean).map(function(t){ return '<span>'+esc(t)+'</span>'; }).join('');
    return '<a class="card" href="'+esc(m.arquivo)+'">'+
      '<div class="cover"><span class="tag">'+esc(c.nome)+'</span>'+(m===recente?'<span class="new">Mais recente</span>':'')+
      '<span class="big">Aldea Barefoot</span>'+icon(c.icone,'mark')+'</div>'+
      '<div class="info"><h4>'+esc(m.titulo)+'</h4><p>'+esc(m.resumo)+'</p><div class="meta">'+meta+'</div>'+
      '<span class="open">Abrir material '+icon('M5 12h14M13 6l6 6-6 6')+'</span></div></a>';
  }
  function vazio(c){ return '<div class="empty"><b>Em breve</b>Os materiais de '+esc(c.nome.toLowerCase())+' aparecem aqui assim que forem publicados.</div>'; }

  function render(id){
    [].forEach.call(catsEl.children, function(b){ var on = b.getAttribute('data-cat')===id; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    todos.hidden = !id;
    if (id) {
      var c = cat(id), itens = doCat(id);
      titulo.textContent = c.nome;
      lista.innerHTML = '<div class="grid">'+(itens.length ? itens.map(card).join('') : vazio(c))+'</div>';
    } else {
      titulo.textContent = 'Todos os materiais';
      lista.innerHTML = CATS.map(function(c){
        var itens = doCat(c.id);
        return '<section class="group"><div class="group-h"><h5>'+esc(c.nome)+'</h5></div><div class="grid">'+
          (itens.length ? itens.map(card).join('') : vazio(c))+'</div></section>';
      }).join('');
    }
  }
  function atual(){ var h = location.hash.replace('#',''); return CATS.some(function(c){ return c.id===h; }) ? h : ''; }

  catsEl.addEventListener('click', function(e){
    var b = e.target.closest('.cat'); if (!b) return;
    var id = b.getAttribute('data-cat');
    location.hash = (atual()===id) ? '' : id;
  });
  todos.onclick = function(){ location.hash = ''; };
  window.addEventListener('hashchange', function(){ render(atual()); });
  render(atual());
})();
</script>
</body>
</html>
